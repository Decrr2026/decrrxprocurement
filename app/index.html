<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECRR Interio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --border:#E5E7EB;
  --text:#101828; --text-muted:#667085; --text-faint:#98A2B3;
  --sidebar-bg:#0B0C0F; --sidebar-bg-2:#0B0C0F; --sidebar-text:#9CA3AF; --sidebar-text-active:#FFFFFF; --sidebar-border:rgba(255,255,255,.08);
  --accent:#4F46E5; --accent-hover:#4338CA; --accent-weak:#EEF2FF; --accent-text:#4338CA;
  --success:#12805C; --success-weak:#E7F7F1; --warning:#B54708; --warning-weak:#FFF6E5;
  --danger:#D92D20; --danger-weak:#FEF2F1;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 8px 16px rgba(16,24,40,.06),0 24px 48px -8px rgba(16,24,40,.14);
  --shadow-hover:0 4px 8px rgba(16,24,40,.04),0 12px 24px rgba(16,24,40,.08);
  --radius:12px; --radius-lg:16px;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0B0D; --surface:#151619; --surface-2:#1D1F23; --border:#2A2C31;
    --text:#F2F3F5; --text-muted:#9AA0AC; --text-faint:#6B7280;
    --sidebar-bg:#000000; --sidebar-bg-2:#000000; --sidebar-text:#9CA3AF; --sidebar-text-active:#FFFFFF; --sidebar-border:rgba(255,255,255,.08);
    --accent:#6366F1; --accent-hover:#818CF8; --accent-weak:rgba(99,102,241,.16); --accent-text:#A5B4FC;
    --success:#34D399; --success-weak:rgba(52,211,153,.14); --warning:#FBBF24; --warning-weak:rgba(251,191,36,.14);
    --danger:#F87171; --danger-weak:rgba(248,113,113,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);
    --shadow-lg:0 8px 20px rgba(0,0,0,.5),0 24px 50px rgba(0,0,0,.55);
    --shadow-hover:0 4px 10px rgba(0,0,0,.45),0 14px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0B0D; --surface:#151619; --surface-2:#1D1F23; --border:#2A2C31;
  --text:#F2F3F5; --text-muted:#9AA0AC; --text-faint:#6B7280;
  --sidebar-bg:#000000; --sidebar-bg-2:#000000; --sidebar-text:#9CA3AF; --sidebar-text-active:#FFFFFF; --sidebar-border:rgba(255,255,255,.08);
  --accent:#6366F1; --accent-hover:#818CF8; --accent-weak:rgba(99,102,241,.16); --accent-text:#A5B4FC;
  --success:#34D399; --success-weak:rgba(52,211,153,.14); --warning:#FBBF24; --warning-weak:rgba(251,191,36,.14);
  --danger:#F87171; --danger-weak:rgba(248,113,113,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);
  --shadow-lg:0 8px 20px rgba(0,0,0,.5),0 24px 50px rgba(0,0,0,.55);
  --shadow-hover:0 4px 10px rgba(0,0,0,.45),0 14px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; letter-spacing:-.006em;
}
h1,h2,h3,h4{font-family:"Inter",sans-serif; font-weight:700; letter-spacing:-.015em; margin:0; text-wrap:balance;}
.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13.5px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 12px; transition:border-color .15s var(--ease), box-shadow .15s var(--ease);}
input:hover,select:hover,textarea:hover{border-color:#C7CBD3;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3.5px var(--accent-weak);}
button:focus-visible,.navlink:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
::placeholder{color:var(--text-faint);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ---- custom scrollbars ---- */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px; border:2px solid var(--bg); background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint); background-clip:padding-box;}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14); border-color:var(--sidebar-bg);}
#sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24);}

/* ---- page transition ---- */
#content{animation:contentIn .32s var(--ease);}
@keyframes contentIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* ---- shell ---- */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:248px; flex:none; background:var(--sidebar-bg); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden;
  transition:transform .25s var(--ease); z-index:40; border-right:1px solid var(--sidebar-border);
}
.brand{display:flex; align-items:center; gap:11px; padding:22px 20px 18px;}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Inter";font-weight:700;font-size:14px;flex:none;}
.brand-mark-logo{width:40px;height:40px;border-radius:9px;background:#fff;padding:5px;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.brand-mark-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-text{line-height:1.25;}
.brand-text b{display:block; color:#fff; font-family:"Inter"; font-weight:600; font-size:14px; letter-spacing:-.01em;}
.brand-text span{display:block; color:var(--sidebar-text); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; margin-top:3px;}
nav.navlist{padding:14px 12px; display:flex; flex-direction:column; gap:1px; flex:1;}
.navlink{position:relative; display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; color:var(--sidebar-text); text-decoration:none; font-size:13.5px; font-weight:500; border:none; background:transparent; width:100%; text-align:left; transition:background .15s var(--ease), color .15s var(--ease);}
.navlink:hover{background:rgba(255,255,255,.06); color:#fff;}
.navlink.active{background:var(--accent); color:#fff; font-weight:600;}
.navlink .ic{width:17px; text-align:center; flex:none; font-size:14px; opacity:.9;}
.sidebar-foot{padding:16px 20px; font-size:11px; color:var(--text-faint); border-top:1px solid var(--sidebar-border); margin-top:auto;}
#sidebar-scrim{display:none;}

#main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; background:var(--surface); background:color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 28px;
}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
#menuBtn{display:none; background:none; border:1px solid var(--border); border-radius:8px; padding:7px 9px; color:var(--text);}
.crumbs{color:var(--text-muted); font-size:12.5px;}
.crumbs b{color:var(--text); font-weight:600;}
.page-title{font-size:19px; margin-top:2px; letter-spacing:-.02em;}
.topbar-right{display:flex; align-items:center; gap:12px; flex:none;}
.clock{font-size:12px; color:var(--text-muted); text-align:right; white-space:nowrap;}
.account-widget{display:flex; align-items:center; gap:4px; padding:5px; border-radius:99px; border:1px solid var(--border); background:var(--surface);}
.user-chip{display:flex; align-items:center; gap:9px; padding:0 4px 0 2px; min-width:0;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Inter"; font-weight:600; font-size:12px; flex:none;}
.user-chip .who{line-height:1.3; min-width:0;}
.user-chip .who b{display:block; font-size:12.5px; font-weight:600; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.user-chip .who span{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--success); font-weight:600; letter-spacing:.01em;}
.user-chip .who span .dot{width:6px;height:6px;border-radius:50%;background:var(--success); flex:none;}
.signout-btn{display:flex; align-items:center; gap:6px; border:none; background:none; color:var(--text-muted); padding:7px 11px; border-radius:99px; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; transition:background .15s var(--ease), color .15s var(--ease);}
.signout-btn svg{width:15px; height:15px; flex:none;}
.signout-btn:hover{background:var(--danger-weak); color:var(--danger);}
@media (max-width:760px){ .clock{display:none;} .user-chip .who{display:none;} .signout-btn span{display:none;} .signout-btn{padding:8px;} }
.mode-flag{font-size:10.5px; padding:2px 7px; border-radius:99px; background:var(--warning-weak); color:var(--warning); font-weight:600; letter-spacing:.02em;}

#content{padding:28px 28px 56px; max-width:1360px; width:100%; margin:0 auto;}

/* ---- generic bits ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); transition:box-shadow .2s var(--ease), transform .2s var(--ease);}
.card-pad{padding:22px 24px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.section-head h2{font-size:15.5px; letter-spacing:-.01em;}
.section-head .hint{color:var(--text-muted); font-size:12.5px; margin-top:3px;}
.grid{display:grid; gap:16px;}
.kpi-row{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.kpi-row{grid-template-columns:1fr;}}
.kpi{display:flex; align-items:center; gap:14px; padding:20px; position:relative; overflow:hidden;}
.kpi:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
.kpi .ic{width:40px;height:40px;border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;}
.kpi .ic.blue{background:var(--accent-weak); color:var(--accent-text);}
.kpi .ic.green{background:var(--success-weak); color:var(--success);}
.kpi .ic.amber{background:var(--warning-weak); color:var(--warning);}
.kpi .ic.red{background:var(--danger-weak); color:var(--danger);}
.kpi .figure{font-family:"Inter"; font-weight:700; font-size:23px; line-height:1.1; letter-spacing:-.02em;}
.kpi .label{color:var(--text-muted); font-size:12px; margin-top:4px;}

.btn{display:inline-flex; align-items:center; gap:7px; border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; border:1px solid transparent; white-space:nowrap; transition:background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease); position:relative;}
.btn:active:not(:disabled){transform:scale(.98);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(79,70,229,.25);}
.btn-primary:hover{background:var(--accent-hover); box-shadow:0 2px 4px rgba(16,24,40,.06),0 4px 10px rgba(79,70,229,.3);}
.btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}
.btn-ghost:hover{background:var(--surface-2); border-color:#C7CBD3;}
.btn-danger{background:var(--danger); color:#fff; box-shadow:0 1px 3px rgba(217,45,32,.28);}
.btn-danger:hover{box-shadow:0 4px 10px rgba(217,45,32,.32);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important; box-shadow:none !important;}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px; transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);}
.iconbtn:hover{background:var(--surface-2); color:var(--text);}
.iconbtn:active{transform:scale(.94);}
.iconbtn.danger:hover{background:var(--danger-weak); color:var(--danger); border-color:var(--danger-weak);}
.iconbtn.accent:hover{background:var(--accent-weak); color:var(--accent-text); border-color:var(--accent-weak);}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--text-muted);}
.field label .req{color:var(--danger);}
.field input,.field select,.field textarea{width:100%;}
.form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:820px){.form-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:600; padding:11px 14px; background:var(--surface-2); white-space:nowrap; border-bottom:1px solid var(--border);}
tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s var(--ease);}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.table-wrap table{border:none; border-radius:0;}
.table-wrap thead th:first-child{border-top-left-radius:var(--radius);} .table-wrap thead th:last-child{border-top-right-radius:var(--radius);}
.cell-muted{color:var(--text-muted); font-size:12.5px;}
.right{text-align:right;} .center{text-align:center;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3.5px 10px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; letter-spacing:.01em;}
.badge.green{background:var(--success-weak); color:var(--success);}
.badge.amber{background:var(--warning-weak); color:var(--warning);}
.badge.red{background:var(--danger-weak); color:var(--danger);}
.badge.blue{background:var(--accent-weak); color:var(--accent-text);}
.badge.grey{background:var(--surface-2); color:var(--text-muted);}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block; flex:none;}
.dot.green{background:var(--success);} .dot.amber{background:var(--warning);} .dot.red{background:var(--danger);}

.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.search-box{position:relative; flex:1; min-width:180px;}
.search-box input{width:100%; padding-left:30px;}
.search-box .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:12px;}
.pill-tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:9px; width:max-content;}
.pill-tab{border:none; background:transparent; padding:7px 14px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-muted); transition:background .15s var(--ease), color .15s var(--ease);}
.pill-tab:hover{color:var(--text);}
.pill-tab.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}

.empty{padding:40px 20px; text-align:center; color:var(--text-muted);}
.empty .big{font-size:26px; margin-bottom:8px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(16,24,40,.5); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100; animation:backdropIn .18s var(--ease);}
@keyframes backdropIn{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:560px; box-shadow:var(--shadow-lg); border:1px solid var(--border); animation:modalIn .18s var(--ease);}
@keyframes modalIn{from{opacity:0; transform:translateY(8px) scale(.99);} to{opacity:1; transform:none;}}
.modal.wide{max-width:760px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:15.5px; letter-spacing:-.01em;}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:9px; padding:14px 22px; border-top:1px solid var(--border);}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-muted); line-height:1; padding:4px; border-radius:6px; transition:background .15s var(--ease), color .15s var(--ease);}
.modal-close:hover{background:var(--surface-2); color:var(--text);}

.stat-line{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
.stat-line:last-child{border-bottom:none;}
.stat-line b{font-family:"IBM Plex Mono"; font-variant-numeric:tabular-nums;}

.toast-wrap{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{background:var(--text); color:var(--surface); padding:11px 17px; border-radius:9px; font-size:13px; font-weight:500; box-shadow:var(--shadow-lg); animation:toastin .22s var(--ease);}
@keyframes toastin{from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:none;}}

.po-items-table input{padding:6px 8px; font-size:12.5px;}
.link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;}
.type-chip{background:var(--surface-2); border:1px solid var(--border); padding:2px 9px; border-radius:99px; font-size:11.5px; color:var(--text-muted);}
.subtle-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;}
.taglist{display:flex; flex-wrap:wrap; gap:7px;}
.tagchip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); padding:5px 6px 5px 11px; border-radius:99px; font-size:12.5px;}
.tagchip button{background:none;border:none;color:var(--text-faint); font-size:13px; padding:2px;}
.site-chip{display:inline-block; background:var(--accent-weak); color:var(--accent-text); padding:1px 8px; border-radius:99px; font-size:10.5px; font-weight:600; margin:0 4px 4px 0;}
.cov-wrap{display:flex; align-items:center; gap:8px; min-width:110px;}
.cov-track{flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; min-width:60px;}
.cov-fill{height:100%; border-radius:99px;}
.cov-fill.green{background:var(--success);} .cov-fill.amber{background:var(--warning);} .cov-fill.red{background:var(--danger);}
.cov-pct{font-size:11px; font-weight:700; color:var(--text-muted); min-width:32px; text-align:right;}
.dash-hero{position:relative; overflow:hidden; display:flex; align-items:center; gap:20px; padding:28px 30px; border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#1E1B4B 0%,var(--accent) 130%);
  color:#fff; margin-bottom:16px; box-shadow:var(--shadow-lg);}
.dash-hero .dash-hero-logo{position:relative; z-index:1; width:52px;height:52px;border-radius:12px;background:#fff;padding:6px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.dash-hero .dash-hero-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.dash-hero h2{position:relative; z-index:1; color:#fff; font-size:19px; margin:0; letter-spacing:-.01em;}
.dash-hero .hint{position:relative; z-index:1; color:rgba(255,255,255,.78); margin-top:4px; font-size:12.5px;}
.breakdown-card{display:flex; flex-direction:column; gap:12px;}
.breakdown-bar{display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--surface-2); width:100%;}
.breakdown-seg{height:100%;}
.breakdown-seg.green{background:var(--success);} .breakdown-seg.amber{background:var(--warning);} .breakdown-seg.red{background:var(--danger);} .breakdown-seg.blue{background:var(--accent);}
.breakdown-legend{display:flex; flex-wrap:wrap; gap:16px; font-size:12px; color:var(--text-muted);}
.breakdown-legend span.sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:middle;}
.dash-toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.dash-toolbar select{min-width:0;}
.filter-label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; display:block;}
.filter-field{display:flex; flex-direction:column;}
.auth-wrap{
  --a-ink:#17140F; --a-paper:#EDE7DB; --a-paper-dim:#8A8271; --a-line:rgba(237,231,219,.14);
  --a-green:#3E5C46; --a-green-bright:#5C8268; --a-brass:#B8935B;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  background:var(--a-ink); position:relative; overflow:hidden;
}
.auth-wrap::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(var(--a-line) 1px, transparent 1px), linear-gradient(90deg, var(--a-line) 1px, transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(460px circle at var(--amx,50%) var(--amy,32%), rgba(0,0,0,.9), rgba(0,0,0,.1) 70%);
  mask-image:radial-gradient(460px circle at var(--amx,50%) var(--amy,32%), rgba(0,0,0,.9), rgba(0,0,0,.1) 70%);
}
.auth-card{position:relative; background:var(--a-paper); color:var(--a-ink);
  border:1px solid var(--a-line); border-radius:3px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
  padding:40px 36px; width:100%; max-width:380px; text-align:center;}
.auth-logo{width:52px;height:52px;border-radius:8px;background:#fff;padding:7px;margin:0 auto 22px;
  border:1px solid rgba(23,20,15,.1); box-shadow:0 2px 8px rgba(0,0,0,.12);}
.auth-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.auth-title{font-family:'Fraunces',Georgia,serif; font-size:24px; font-weight:600; letter-spacing:.01em; text-transform:uppercase; color:var(--a-ink); margin:0;}
.auth-sub{color:#5A5344; font-size:13.5px; margin-top:8px;}
.auth-splash-msg{color:#5A5344; font-size:12.5px; margin-top:14px;}
.auth-error{background:rgba(155,50,40,.08); color:#8c3527; border:1px solid rgba(155,50,40,.25); border-radius:2px; padding:9px 12px; font-size:12.5px; margin-top:18px; text-align:left;}
.auth-card .field{text-align:left; margin-top:14px;}
.auth-card .field label{text-align:left; color:#5A5344; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Mono',monospace;}
.auth-card input{border-radius:2px;}
.auth-card .btn-primary{width:100%; justify-content:center; background:var(--a-green); border-color:var(--a-green);
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; border-radius:2px;}
.auth-card .btn-primary:hover{background:var(--a-green-bright); border-color:var(--a-green-bright);}
.auth-foot{margin-top:26px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;}
.auth-foot a{color:var(--a-paper-dim); text-decoration:none; border-bottom:1px solid transparent; transition:color .2s, border-color .2s;}
.auth-foot a:hover{color:var(--a-brass); border-color:var(--a-brass);}
@media (max-width:640px){
  #sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
  #sidebar.open{transform:translateX(0);}
  #sidebar.open ~ #sidebar-scrim, body.nav-open #sidebar-scrim{display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35;}
  #menuBtn{display:inline-flex;}
  #content{padding:16px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ============================= tiny utils ============================= */
function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function uid(prefix){ return prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function num(v,fallback){ var n=parseFloat(v); return isFinite(n)?n:(fallback===undefined?0:fallback); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function fmtCurrency(n){ var v=round2(n||0); return (state.settings.currency||"₹")+v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
// jsPDF's built-in Helvetica font only supports WinAnsi (Latin-1) characters — the ₹ Rupee

function fmtCurrencyPdf(n){ var v=round2(n||0); return "Rs. "+v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n){ return round2(n||0).toLocaleString("en-IN"); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return "—"; var p=iso.split("-"); if(p.length!==3) return iso; var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return p[2]+" "+months[parseInt(p[1],10)-1]+" "+p[0]; }
function debounce(fn,ms){ var t; return function(){ var args=arguments,ctx=this; clearTimeout(t); t=setTimeout(function(){fn.apply(ctx,args);},ms); }; }
function toast(msg,tone){
  var el=document.createElement("div"); el.className="toast"; el.textContent=msg;

/* ============================= calculations ============================= */
function materialTxns(materialId){ return state.transactions.filter(function(t){return t.materialId===materialId;}); }
function stockFor(materialId){
  var txns = materialTxns(materialId);
  var opening=0, received=0, issued=0, adjust=0;
  txns.forEach(function(t){
    var q = num(t.qty,0);
    if(t.type==="opening") opening += q;
    else if(t.type==="received") received += q;
    else if(t.type==="issued") issued += q;
    else if(t.type==="adjust") adjust += q;
  });
  var closing = opening + received - issued + adjust;
  return {opening:opening, received:received, issued:issued, adjust:adjust, closing:round2(closing)};
}
function reorderLevel(material){ return num(material.siteRequirement,0) * (num(state.settings.lowStockThresholdPct,50)/100); }
function stockStatus(material, closing){
  if(closing<=0) return {label:"Out of Stock", tone:"red"};
  if(closing < reorderLevel(material)) return {label:"Low Stock", tone:"amber"};
  return {label:"In Stock", tone:"green"};
}
function pendingOrderedQty(materialId){
  var pend = 0;
  state.purchaseOrders.forEach(function(po){
    if(po.status==="Cancelled") return;
    po.items.forEach(function(it){
      if(it.materialId!==materialId) return;
      var remain = num(it.qty,0) - num(it.receivedQty,0);
      if(remain>0) pend += remain;
    });
  });
  return round2(pend);
}
function poItemsTotal(po){ return po.items.reduce(function(s,it){ return s+num(it.qty,0)*num(it.rate,0); },0); }
function poReceivedTotal(po){ return po.items.reduce(function(s,it){ return s+num(it.receivedQty,0)*num(it.rate,0); },0); }
// GST helpers — poItemsTotal() above stays the pre-tax (taxable) value, unchanged, since it's
// used throughout for stock valuation and reporting; these add the GST layer on top for display.
function poItemGstAmount(it){ return num(it.qty,0)*num(it.rate,0)*num(it.gstPct,0)/100; }
function poItemsGstTotal(po){ return po.items.reduce(function(s,it){ return s+poItemGstAmount(it); },0); }
function poItemsGrandTotal(po){ return poItemsTotal(po) + poItemsGstTotal(po); }
function computePoStatus(po){
  var totalQty = po.items.reduce(function(s,it){return s+num(it.qty,0);},0);
  var recvQty = po.items.reduce(function(s,it){return s+num(it.receivedQty,0);},0);
  if(po.status==="Cancelled") return "Cancelled";
  if(recvQty<=0) return "Placed";
  if(recvQty>=totalQty) return "Received";
  return "Partial";
}

/* ============================= vendor ledger (bills / payments / credit period) =============================
   A vendor's "amount due" is never derived from a single PO. It comes from a proper running ledger:
   every Bill (the vendor's actual tax invoice — its own date, number and amount, entered separately from
   the PO) is a debit, every Payment is a credit, and the balance is the sum of all of them. The due date
   for aging (Overdue / Due Soon) is based on the Bill Date (the tax invoice date) plus the vendor's credit
   period, applied FIFO against the oldest unpaid bill — the same way a real accounts-payable ledger ages. */
function vendorById(id){ return state.vendors.filter(function(v){return v.id===id;})[0] || null; }
function addDaysISO(dateStr, days){
  var d = dateStr ? new Date(dateStr+"T00:00:00") : new Date();
  if(isNaN(d.getTime())) d = new Date();
  d.setDate(d.getDate()+num(days,30));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function poBills(poId){ return state.bills.filter(function(b){return b.poId===poId;}); }
function poBilledTotal(poId){ return poBills(poId).reduce(function(s,b){return s+num(b.amount,0);},0); }
function vendorBills(vendorId){ return state.bills.filter(function(b){return b.vendorId===vendorId;}); }
function vendorPayments(vendorId){ return state.payments.filter(function(p){return p.vendorId===vendorId;}); }
function vendorTotalBilled(vendorId){ return vendorBills(vendorId).reduce(function(s,b){return s+num(b.amount,0);},0); }
function vendorTotalPaid(vendorId){ return vendorPayments(vendorId).reduce(function(s,p){return s+num(p.amount,0);},0); }
function vendorBalanceDue(vendorId){ return round2(vendorTotalBilled(vendorId) - vendorTotalPaid(vendorId)); }
// Ledger: bills (debit) + payments (credit), oldest first, with a running balance — same shape as the
// existing material stock ledger, applied to money instead of quantity.
function vendorLedgerEntries(vendorId){
  var entries = [];
  vendorBills(vendorId).forEach(function(b){
    entries.push({date:b.billDate, kind:"bill", id:b.id, ref:(b.billNumber?("Tax Invoice "+b.billNumber):"Bill"), billNumber:b.billNumber||"", poId:b.poId||"", remark:b.remark||"", debit:num(b.amount,0), credit:0, createdAt:b.createdAt||""});
  });
  vendorPayments(vendorId).forEach(function(p){
    entries.push({date:p.date, kind:"payment", id:p.id, ref:"Payment", poId:"", remark:p.remark||"", debit:0, credit:num(p.amount,0), createdAt:p.createdAt||""});
  });
  entries.sort(function(a,b){
    var d = (a.date||"").localeCompare(b.date||""); if(d!==0) return d;
    return (a.createdAt||"").localeCompare(b.createdAt||"");
  });
  var running = 0;
  entries.forEach(function(e){ running = round2(running + e.debit - e.credit); e.balance = running; });
  return entries;
}
// Walks bills oldest-first, applying total payments FIFO, to find the oldest bill that is not yet
// fully covered — that bill's due date drives the vendor's Overdue / Due Soon status.
function vendorOldestUnpaidBill(vendorId){
  var bills = vendorBills(vendorId).slice().sort(function(a,b){return (a.billDate||"").localeCompare(b.billDate||"");});
  var pool = vendorTotalPaid(vendorId);
  for(var i=0;i<bills.length;i++){
    var amt = num(bills[i].amount,0);
    if(pool >= amt - 0.004){ pool -= amt; continue; }
    return {bill:bills[i], remaining:round2(amt-pool)};
  }
  return null;
}
function vendorDueDate(vendorId){
  var oldest = vendorOldestUnpaidBill(vendorId); if(!oldest) return "";
  var vendor = vendorById(vendorId);
  var creditDays = vendor ? num(vendor.creditPeriodDays,30) : 30;
  return addDaysISO(oldest.bill.billDate, creditDays);
}
// Days Overdue = Today − Due Date (of the oldest unpaid bill). Negative means not due yet.
// The three action tiers below (Supply Continue / Please Mail / Supply Stop) mirror the
// classic bill-wise vendor ageing sheet: mild or no overdue keeps supply going, crossing the
// Mail Reminder threshold means chase payment, and crossing the Supply Stop threshold means
// stop supplying that vendor until they pay. Both thresholds are configurable in Settings.
function vendorDaysOverdue(vendorId){
  var dueDate = vendorDueDate(vendorId); if(!dueDate) return null;
  var today = todayISO();
  return Math.round((new Date(today+"T00:00:00") - new Date(dueDate+"T00:00:00")) / 86400000);
}
function vendorPayableSummary(vendorId){
  var balanceDue = vendorBalanceDue(vendorId);
  var billCount = vendorBills(vendorId).length;
  if(balanceDue<=0.004) return {balanceDue:0, dueDate:"", daysOverdue:null, tone:"green", label:"Paid Up", billCount:billCount};
  var dueDate = vendorDueDate(vendorId);
  var daysOverdue = vendorDaysOverdue(vendorId);
  var stopDays = num(state.settings.supplyStopDays,60);
  var mailDays = num(state.settings.mailReminderDays,21);
  var tone="blue", label="Supply Continue";
  if(daysOverdue!==null && daysOverdue>stopDays){ tone="red"; label="Badly Overdue — Supply Stop"; }
  else if(daysOverdue!==null && daysOverdue>=mailDays){ tone="amber"; label="Overdue — Please Mail"; }
  return {balanceDue:balanceDue, dueDate:dueDate, daysOverdue:daysOverdue, tone:tone, label:label, billCount:billCount};
}
function addBill(poId, vendorId, billNumber, billDate, amount, remark){
  if(!(amount>0)){ toast("Enter a bill amount greater than 0.","danger"); return Promise.resolve(false); }
  if(!vendorId){ toast("This bill needs a vendor.","danger"); return Promise.resolve(false); }
  var id = uid("bill");
  var data = {id:id, poId:poId||"", vendorId:vendorId, billNumber:(billNumber||"").trim(), billDate:billDate||todayISO(), amount:num(amount,0), remark:(remark||"").trim()};
  return persist("bills", id, data).then(function(){ toast("Bill of "+fmtCurrency(amount)+" recorded."); return true; }).catch(function(){ return false; });
}
function deleteBill(id){
  var b = state.bills.filter(function(x){return x.id===id;})[0]; if(!b) return;
  if(!confirmAction("Delete this bill of "+fmtCurrency(b.amount)+"? This cannot be undone.")) return;
  persist("bills", id, null, true).then(function(){ toast("Bill deleted."); });
}
function recordPayment(vendorId, amount, date, remark){

}
function deletePayment(id){

}
function dashboardRow(material){
  var stock = stockFor(material.id);
  var requirement = num(material.siteRequirement,0);
  var available = stock.closing;
  var orderPlaced = pendingOrderedQty(material.id);
  var coverage = requirement>0 ? (available+orderPlaced)/requirement : 1;
  var toPurchase = coverage>=1 ? 0 : Math.max(0, round2(requirement-(available+orderPlaced)));
  var status, tone, dot;
  if(toPurchase<=0){
    if(orderPlaced>0){ status="Order Placed"; } else { status="Sufficient Stock"; }
    tone="green"; dot="green";
  } else if(coverage > (num(state.settings.partialStockThresholdPct,60)/100)){
    status="Partial Stock"; tone="amber"; dot="amber";
  } else {
    status="Purchase Required"; tone="red"; dot="red";
  }
  return {material:material, requirement:requirement, available:available, orderPlaced:orderPlaced, toPurchase:toPurchase, status:status, tone:tone, dot:dot, coverage:coverage};
}
function allDashboardRows(){ return state.materials.map(dashboardRow); }
function materialSitesUsed(materialId){
  var set = {};
  state.transactions.forEach(function(t){ if(t.materialId===materialId && t.type==="issued" && t.siteId){ set[t.siteId]=true; } });
  return Object.keys(set);
}
function totalStockValue(){ return state.materials.reduce(function(s,m){ return s+stockFor(m.id).closing*num(m.purchaseRate,0); },0); }
function nextPoNumber(){
  var n = state.purchaseOrders.length+1;
  var existingNums = state.purchaseOrders.map(function(p){ var m=/(\d+)$/.exec(p.poNumber||""); return m?parseInt(m[1],10):0; });
  var maxN = existingNums.length? Math.max.apply(null,existingNums):0;
  n = Math.max(n, maxN+1);
  return (state.settings.poPrefix||"PO-2026-")+String(n).padStart(4,"0");
}
function vendorName(id){ var v=state.vendors.filter(function(x){return x.id===id;})[0]; return v?v.name:"—"; }
function materialById(id){ return state.materials.filter(function(m){return m.id===id;})[0]; }

/* ============================= persistence layer (Supabase) ============================= */
// This app talks directly to a Supabase project (Postgres + Auth) — no separate backend
// server. SUPABASE_ANON_KEY above is safe to ship in this file: it can only do what the
// database's row-level-security policies allow (see supabase-setup.sql), which here is
// "nothing unless the request comes from a signed-in user."
var supa = null;
var realtimeChannel = null;
var KIND_TABLE = { materials:"materials", vendors:"vendors", purchaseOrders:"purchase_orders", transactions:"transactions", payments:"payments", bills:"bills" };

function initApp(){
  if(!(window.supabase && typeof window.supabase.createClient==="function")){
    toast("Could not load the database library — check your internet connection and reload.","danger");
    state.authReady = true; render();
    return;
  }
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  state.db = supa; // truthy marker used by a few legacy checks elsewhere in this file
  supa.auth.getSession().then(function(res){
    var session = res && res.data && res.data.session;
    state.authReady = true;
    if(session){ onAuthed(session); } else { render(); }
  }).catch(function(){ state.authReady = true; render(); });
  supa.auth.onAuthStateChange(function(event, session){
    if(event==="SIGNED_IN" && session){ onAuthed(session); }
    else if(event==="SIGNED_OUT"){
      state.session = null; state.dataLoaded = false;
      if(realtimeChannel){ supa.removeChannel(realtimeChannel); realtimeChannel = null; }
      render();
    }
  });
}
function onAuthed(session){
  state.session = session;
  state.authError = "";
  loadAllData().then(function(){
    state.dataLoaded = true;
    render();
    wireRealtime();
  }).catch(function(err){
    console.error("Initial data load failed", err);
    toast((err&&err.message)||"Could not load data from the database.","danger");
    state.dataLoaded = true;
    render();
  });
}
function doLogin(email, password){
  if(!email || !password){ state.authError = "Enter both email and password."; render(); return; }
  state.authBusy = true; state.authError = ""; render();
  supa.auth.signInWithPassword({email:email, password:password}).then(function(res){
    state.authBusy = false;
    if(res.error){ state.authError = res.error.message || "Could not sign in."; render(); return; }
    // onAuthStateChange fires onAuthed(); nothing else to do here.
  }).catch(function(err){
    state.authBusy = false;
    state.authError = (err&&err.message) || "Could not sign in.";
    render();
  });
}
function doLogout(){
  if(supa) supa.auth.signOut();
}

/* ---- camelCase (app) <-> snake_case (Postgres) row mapping ---- */
function toSnakeRow(kind, obj){
  if(kind==="materials"){
    return { id:obj.id, name:obj.name||"", type:obj.type||"", description:obj.description||"", uom:obj.uom||"",
      site_requirement:num(obj.siteRequirement,0), purchase_rate:num(obj.purchaseRate,0),
      preferred_vendor_id: obj.preferredVendorId || null };
  }
  if(kind==="vendors"){
    return { id:obj.id, name:obj.name||"", contact:obj.contact||"", phone:obj.phone||"", email:obj.email||"", address:obj.address||"", gstin:obj.gstin||"",
      credit_period_days: num(obj.creditPeriodDays,30) };
  }
  if(kind==="purchaseOrders"){
    return { id:obj.id, po_number:obj.poNumber||"", vendor_id:obj.vendorId||null, date:obj.date||null, status:obj.status||"Placed", terms:obj.terms||"", site_id:obj.siteId||"" };
  }
  if(kind==="transactions"){
    return { id:obj.id, material_id:obj.materialId||null, material_name:obj.materialName||"", type:obj.type||"", qty:num(obj.qty,0), rate:num(obj.rate,0),
      po_id:obj.poId||null, po_number:obj.poNumber||"", date:obj.date||null, site_id:obj.siteId||"", remark:obj.remark||"" };
  }
  if(kind==="payments"){
    return { id:obj.id, vendor_id:obj.vendorId||null, amount:num(obj.amount,0), date:obj.date||null, remark:obj.remark||"" };
  }
  if(kind==="bills"){
    return { id:obj.id, po_id:obj.poId||null, vendor_id:obj.vendorId||null, bill_number:obj.billNumber||"", bill_date:obj.billDate||null, amount:num(obj.amount,0), remark:obj.remark||"" };
  }
  return obj;
}
function fromSnakeRow(kind, row){
  if(kind==="materials"){
    return { id:row.id, name:row.name||"", type:row.type||"", description:row.description||"", uom:row.uom||"",
      siteRequirement:num(row.site_requirement,0), purchaseRate:num(row.purchase_rate,0), preferredVendorId: row.preferred_vendor_id || "" };
  }
  if(kind==="vendors"){
    return { id:row.id, name:row.name||"", contact:row.contact||"", phone:row.phone||"", email:row.email||"", address:row.address||"", gstin:row.gstin||"",
      creditPeriodDays: num(row.credit_period_days,30) };
  }
  if(kind==="purchaseOrders"){
    return { id:row.id, poNumber:row.po_number||"", vendorId:row.vendor_id||"", date:row.date||"", status:row.status||"Placed", terms:row.terms||"", siteId:row.site_id||"", items:[] };
  }
  if(kind==="transactions"){
    return { id:row.id, materialId:row.material_id||"", materialName:row.material_name||"", type:row.type||"", qty:num(row.qty,0), rate:num(row.rate,0),
      poId:row.po_id||"", poNumber:row.po_number||"", date:row.date||"", siteId:row.site_id||"", remark:row.remark||"", createdAt:row.created_at||"" };
  }
  if(kind==="payments"){
    return { id:row.id, vendorId:row.vendor_id||"", amount:num(row.amount,0), date:row.date||"", remark:row.remark||"", createdAt:row.created_at||"" };
  }
  if(kind==="bills"){
    return { id:row.id, poId:row.po_id||"", vendorId:row.vendor_id||"", billNumber:row.bill_number||"", billDate:row.bill_date||"", amount:num(row.amount,0), remark:row.remark||"", createdAt:row.created_at||"" };
  }
  return row;
}
function localApply(kind, id, data, isDelete){
  var arr = state[kind];
  var idx = arr.findIndex(function(x){return x.id===id;});
  if(isDelete){ if(idx>-1) arr.splice(idx,1); }
  else if(idx>-1){ arr[idx] = data; } else { arr.push(data); }
}
function syncPoItems(poId, items){
  return supa.from("po_items").delete().eq("po_id", poId).then(function(delRes){
    if(delRes.error) throw delRes.error;
    if(!items || !items.length) return;
    var rows = items.map(function(it){
      return { po_id:poId, material_id:it.materialId||null, material_name:it.materialName||"", qty:num(it.qty,0), rate:num(it.rate,0), gst_pct:num(it.gstPct,18), received_qty:num(it.receivedQty,0), remark:it.remark||"" };
    });
    return supa.from("po_items").insert(rows).then(function(insRes){ if(insRes.error) throw insRes.error; });
  });
}
function persist(kind, id, data, isDelete){
  // kind: materials | vendors | purchaseOrders | transactions
  // Optimistic update: apply to local state and repaint immediately so the UI never waits on
  // a network round-trip, then write to Supabase in the background. A rejected write rolls the
  // optimistic change back with a clear error instead of leaving the UI silently out of sync.
  // (Realtime subscriptions — see wireRealtime() — also reconcile state from the server shortly
  // after, the same way the old Firestore onSnapshot listeners used to.)
  var prevSnapshot = state[kind].slice();
  localApply(kind, id, data, isDelete);
  render();
  var table = KIND_TABLE[kind];
  var op = isDelete ? supa.from(table).delete().eq("id", id) : supa.from(table).upsert(toSnakeRow(kind, data));
  return op.then(function(res){
    if(res.error) throw res.error;
    if(kind==="purchaseOrders" && !isDelete) return syncPoItems(id, data.items);
  }).catch(function(err){
    state[kind] = prevSnapshot;
    render();
    var msg = (err && err.message) ? err.message : "The change could not be saved.";
    toast(msg, "danger");
    throw err;
  });
}
function persistSettings(){
  var s = state.settings;
  var row = { id:"config", company_name:s.companyName, company_tagline:s.companyTagline, currency:s.currency,
    low_stock_threshold_pct:num(s.lowStockThresholdPct,50), partial_stock_threshold_pct:num(s.partialStockThresholdPct,60),
    mail_reminder_days:num(s.mailReminderDays,21), supply_stop_days:num(s.supplyStopDays,60),
    po_prefix:s.poPrefix, material_types:s.materialTypes, uom_list:s.uomList, sites:s.sites };
  return supa.from("settings").upsert(row).then(function(res){ if(res.error) throw res.error; });
}
function loadAllData(){
  return Promise.all([
    supa.from("materials").select("*"),
    supa.from("vendors").select("*"),
    supa.from("purchase_orders").select("*"),
    supa.from("po_items").select("*"),
    supa.from("transactions").select("*"),
    supa.from("settings").select("*").eq("id","config").maybeSingle(),
    supa.from("payments").select("*"),
    supa.from("bills").select("*")
  ]).then(function(results){
    var matRes=results[0], venRes=results[1], poRes=results[2], itemsRes=results[3], txRes=results[4], setRes=results[5], payRes=results[6], billRes=results[7];
    [matRes,venRes,poRes,itemsRes,txRes,setRes,payRes,billRes].forEach(function(r){ if(r && r.error) console.error(r.error); });
    state.payments = (payRes.data||[]).map(function(r){ return fromSnakeRow("payments", r); });
    state.bills = (billRes.data||[]).map(function(r){ return fromSnakeRow("bills", r); });
    state.materials = (matRes.data||[]).map(function(r){ return fromSnakeRow("materials", r); });
    state.vendors = (venRes.data||[]).map(function(r){ return fromSnakeRow("vendors", r); });
    var itemsByPo = {};
    (itemsRes.data||[]).forEach(function(it){
      var arr = itemsByPo[it.po_id] || (itemsByPo[it.po_id]=[]);
      arr.push({ materialId: it.material_id||"", materialName: it.material_name||"", qty:num(it.qty,0), rate:num(it.rate,0), gstPct:num(it.gst_pct,18), receivedQty:num(it.received_qty,0), remark: it.remark||"" });
    });
    state.purchaseOrders = (poRes.data||[]).map(function(r){
      var po = fromSnakeRow("purchaseOrders", r);
      po.items = itemsByPo[r.id] || [];
      return po;
    });
    state.transactions = (txRes.data||[]).map(function(r){ return fromSnakeRow("transactions", r); });
    if(setRes && setRes.data){
      var d = setRes.data;
      state.settings = Object.assign({}, state.settings, {
        companyName:d.company_name, companyTagline:d.company_tagline, currency:d.currency,
        lowStockThresholdPct:num(d.low_stock_threshold_pct,50), partialStockThresholdPct:num(d.partial_stock_threshold_pct,60),
        mailReminderDays:num(d.mail_reminder_days,21), supplyStopDays:num(d.supply_stop_days,60),
        poPrefix:d.po_prefix, materialTypes:(d.material_types&&d.material_types.length?d.material_types:DEFAULT_MATERIAL_TYPES.slice()),
        uomList:(d.uom_list&&d.uom_list.length?d.uom_list:DEFAULT_UOM.slice()), sites:d.sites||[]
      });
    }
  });
}
function wireRealtime(){
  if(realtimeChannel) return;
  var reload = debounce(function(){
    loadAllData().then(render).catch(function(err){ console.error("Realtime reload failed", err); });
  }, 500);
  realtimeChannel = supa.channel("db-changes")
    .on("postgres_changes", {event:"*", schema:"public", table:"materials"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"vendors"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"purchase_orders"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"po_items"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"transactions"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"settings"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"payments"}, reload)
    .on("postgres_changes", {event:"*", schema:"public", table:"bills"}, reload)
    .subscribe();
}

/* ============================= mutations ============================= */
function upsertMaterial(id, payload){
  var isNew = !id;
  var finalId = id || uid("m");
  var existing = materialById(finalId) || {};
  var data = Object.assign({id:finalId}, existing, payload);
  persist("materials", finalId, data).then(function(){
    toast(isNew? "Material added.":"Material updated.");
    if(!state.db) render();
  }).catch(function(e){ toast("Could not save material.","danger"); });
}
function deleteMaterial(id){
  var m = materialById(id); if(!m) return;
  if(!confirmAction('Delete "'+m.name+'"? This will also remove its stock ledger and cannot be undone.')) return;
  persist("materials", id, null, true).then(function(){
    materialTxns(id).forEach(function(t){ persist("transactions", t.id, null, true); });
    toast("Material deleted.");
    if(!state.db) render();
  });
}
function upsertVendor(id, payload){
  var isNew = !id;
  var finalId = id || uid("v");
  var existing = state.vendors.filter(function(v){return v.id===finalId;})[0] || {};
  var data = Object.assign({id:finalId}, existing, payload);
  persist("vendors", finalId, data).then(function(){ toast(isNew?"Vendor added.":"Vendor updated."); if(!state.db) render(); });
}
// Quick-add used from the Create Purchase Order form: create a vendor with just the essentials
// and hand back its id so the caller can select it immediately, without leaving the PO screen.
function quickAddVendor(payload){
  if(!payload.name || !payload.name.trim()){ toast("Enter a vendor name.","danger"); return Promise.resolve(null); }
  var id = uid("v");
  var data = { id:id, name:payload.name.trim(), contact:(payload.contact||"").trim(), phone:(payload.phone||"").trim(), email:"", address:"", gstin:"", creditPeriodDays:num(payload.creditPeriodDays,30) };
  return persist("vendors", id, data).then(function(){ toast("Vendor added."); return id; }).catch(function(){ return null; });
}
function deleteVendor(id){
  var v = state.vendors.filter(function(x){return x.id===id;})[0]; if(!v) return;
  var inUse = state.purchaseOrders.some(function(p){return p.vendorId===id;});
  if(inUse){ toast("Can't delete — vendor has purchase orders on record.","danger"); return; }
  if(!confirmAction('Delete vendor "'+v.name+'"?')) return;
  persist("vendors", id, null, true).then(function(){ toast("Vendor deleted."); if(!state.db) render(); });
}
// Full add-or-edit mutations for the dedicated Vendor Bills page (the quick-add mini-forms inside
// a PO's popup and the Vendor Ledger call addBill()/recordPayment() below instead, which only ever
// create a new record — editing an existing bill or payment happens here).
function upsertBill(id, payload){
  if(!(num(payload.amount,0)>0)){ toast("Enter a bill amount greater than 0.","danger"); return; }
  if(!payload.vendorId){ toast("Select a vendor for this bill.","danger"); return; }
  var isNew = !id;
  var finalId = id || uid("bill");
  var existing = state.bills.filter(function(b){return b.id===finalId;})[0] || {};
  var data = Object.assign({id:finalId}, existing, payload);
  persist("bills", finalId, data).then(function(){ toast(isNew?"Bill added.":"Bill updated."); if(!state.db) render(); });
}
function upsertPayment(id, payload){
  if(!(num(payload.amount,0)>0)){ toast("Enter a payment amount greater than 0.","danger"); return; }
  if(!payload.vendorId){ toast("Select a vendor for this payment.","danger"); return; }
  var isNew = !id;
  var finalId = id || uid("pay");
  var existing = state.payments.filter(function(p){return p.id===finalId;})[0] || {};
  var data = Object.assign({id:finalId}, existing, payload);
  persist("payments", finalId, data).then(function(){ toast(isNew?"Payment added.":"Payment updated."); if(!state.db) render(); });
}
function createTransaction(t){
  var data = Object.assign({id:uid("tx"), createdAt:new Date().toISOString()}, t);
  return persist("transactions", data.id, data).then(function(){ if(!state.db) render(); return data; });
}
function savePO(po){
  var isNew = !po.id;
  var finalId = po.id || uid("po");
  po.id = finalId;
  po.status = computePoStatus(po);
  return persist("purchaseOrders", finalId, po).then(function(){ toast(isNew?"Purchase order created.":"Purchase order updated."); if(!state.db) render(); return po; });

function cancelPO(id){
  var po = state.purchaseOrders.filter(function(p){return p.id===id;})[0]; if(!po) return;

}
/* ============================= PO document: PDF + email ============================= */
function generatePoPdfBlob(po){
  var doc = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var margin = 42;
  var bottomLimit = pageHeight - 60;
  var vendor = state.vendors.filter(function(v){return v.id===po.vendorId;})[0] || {};
  var pageNum = 1;

  // hand-drawn throughout with jsPDF's own primitives — no external table plugin. (A prior
  // version depended on jspdf-autotable loaded from cdnjs, but that file 404s at every version
  // tried, which silently broke both PDF and email since email generates a PDF first.)

  function drawLetterhead(){
    doc.setFillColor(47,111,237);
    doc.rect(0, 0, pageWidth, 6, "F");
    var logoW = 50, logoH = Math.round(logoW/1.564);
    var textX = margin;
    try{
      if(LOGO_DATA_URI){
        doc.addImage(LOGO_DATA_URI, "PNG", margin, 16, logoW, logoH);
        textX = margin + logoW + 12;
      }
    }catch(e){ /* if the image ever fails to decode, fall back to text-only letterhead */ }
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(20,24,46);
    doc.text(state.settings.companyName || "DECRR Interio", textX, 34);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(100);
    doc.text(state.settings.companyTagline || "Procurement & Inventory System", textX, 48);

    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(20,24,46);
    doc.text("PURCHASE ORDER", pageWidth-margin, 40, {align:"right"});
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(70);
    doc.text("PO No.  "+po.poNumber, pageWidth-margin, 56, {align:"right"});
    doc.text("Date  "+fmtDate(po.date), pageWidth-margin, 69, {align:"right"});
    doc.text("Status  "+po.status, pageWidth-margin, 82, {align:"right"});
    doc.setDrawColor(225); doc.line(margin, 96, pageWidth-margin, 96);
    return 96;
  }
  function drawFooter(){
    doc.setDrawColor(230); doc.line(margin, pageHeight-40, pageWidth-margin, pageHeight-40);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140);
    doc.text((state.settings.companyName||"DECRR Interio")+"  ·  Generated on "+fmtDate(todayISO()), margin, pageHeight-26);
    doc.text("Page "+pageNum, pageWidth-margin, pageHeight-26, {align:"right"});
  }

  var y = drawLetterhead();
  y += 22;
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(100);
  doc.text("VENDOR", margin, y); y += 15;
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(20,24,46);
  doc.text(vendor.name||"—", margin, y); y += 15;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(70);
  if(vendor.contact){ doc.text("Attn: "+vendor.contact, margin, y); y += 13; }
  if(vendor.address){ doc.text(vendor.address, margin, y); y += 13; }
  var contactLine = [vendor.phone, vendor.email].filter(Boolean).join("   ·   ");
  if(contactLine){ doc.text(contactLine, margin, y); y += 13; }
  if(vendor.gstin){ doc.text("GSTIN: "+vendor.gstin, margin, y); y += 13; }
  y += 14;

  // ---- item table: wraps long material/remark text and grows each row's height to fit ----
  var cols = [
    {label:"Material", width:118, align:"left"},
    {label:"UOM", width:32, align:"center"},
    {label:"Qty", width:38, align:"right"},
    {label:"Rate", width:58, align:"right"},
    {label:"Taxable", width:64, align:"right"},
    {label:"GST", width:44, align:"right"},
    {label:"Amount", width:70, align:"right"},
    {label:"Remarks", width:87, align:"left"}
  ];
  var tableWidth = cols.reduce(function(s,c){return s+c.width;},0);
  var lineH = 11;
  var cellPad = 6;
  function colX(i){ var x=margin; for(var k=0;k<i;k++) x+=cols[k].width; return x; }
  function wrapped(text, i){ return doc.splitTextToSize(String(text==null?"":text), cols[i].width-cellPad*2); }
  function drawCellLines(lines, i, rowY, rowH){
    var c = cols[i]; var x = colX(i);
    var tx = x+cellPad, align = "left";
    if(c.align==="right"){ tx = x+c.width-cellPad; align = "right"; }
    else if(c.align==="center"){ tx = x+c.width/2; align = "center"; }
    var blockH = lines.length*lineH;
    var startY = rowY + (rowH-blockH)/2 + lineH - 2;
    lines.forEach(function(ln,li){ doc.text(ln, tx, startY+li*lineH, {align:align}); });
  }
  function drawHeaderRow(rowY){
    doc.setFillColor(47,111,237);
    doc.rect(margin, rowY, tableWidth, 24, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(255,255,255);
    cols.forEach(function(c,i){ drawCellLines([c.label], i, rowY, 24); });
    return rowY+24;
  }
  function startNewPage(){
    drawFooter();
    doc.addPage();
    pageNum += 1;
    y = drawLetterhead() + 20;
    y = drawHeaderRow(y);
  }

  y = drawHeaderRow(y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  po.items.forEach(function(it, idx){
    var m = materialById(it.materialId);
    var materialLines = wrapped(it.materialName||"—", 0);
    var remarkLines = wrapped(it.remark||"—", 7);
    var rowH = Math.max(24, Math.max(materialLines.length, remarkLines.length)*lineH + 10);
    if(y + rowH > bottomLimit) startNewPage();
    if(idx%2===1){ doc.setFillColor(245,246,250); doc.rect(margin, y, tableWidth, rowH, "F"); }
    var taxable = num(it.qty,0)*num(it.rate,0);
    doc.setTextColor(30,34,58);
    drawCellLines(materialLines, 0, y, rowH);
    drawCellLines([m?m.uom:""], 1, y, rowH);
    drawCellLines([fmtNum(it.qty)], 2, y, rowH);
    drawCellLines([fmtCurrencyPdf(it.rate)], 3, y, rowH);
    drawCellLines([fmtCurrencyPdf(taxable)], 4, y, rowH);
    drawCellLines([fmtNum(it.gstPct)+"%"], 5, y, rowH);
    drawCellLines([fmtCurrencyPdf(taxable+poItemGstAmount(it))], 6, y, rowH);
    doc.setTextColor(90,96,120);
    drawCellLines(remarkLines, 7, y, rowH);
    doc.setDrawColor(228);
    doc.line(margin, y+rowH, margin+tableWidth, y+rowH);
    y += rowH;
  });

  if(y + 60 > bottomLimit) startNewPage();
  y += 20;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(70);
  doc.text("Subtotal: "+fmtCurrencyPdf(poItemsTotal(po)), pageWidth-margin, y, {align:"right"}); y += 15;
  doc.text("GST: "+fmtCurrencyPdf(poItemsGstTotal(po)), pageWidth-margin, y, {align:"right"}); y += 17;
  doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(20,24,46);
  doc.text("Grand Total: "+fmtCurrencyPdf(poItemsGrandTotal(po)), pageWidth-margin, y, {align:"right"});

  // ---- terms & conditions / remarks ----
  var termsText = (po.terms||"").trim() || "No remarks recorded for this order.";
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  var termsLines = doc.splitTextToSize(termsText, tableWidth-24);
  var termsBoxH = Math.max(40, termsLines.length*12 + 30);
  if(y + 24 + termsBoxH > bottomLimit) startNewPage();
  y += 24;
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(100);
  doc.text("REMARKS / TERMS & CONDITIONS", margin, y);
  y += 8;
  doc.setDrawColor(225); doc.setFillColor(250,250,252);
  doc.rect(margin, y, tableWidth, termsBoxH, "FD");
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(60,66,90);
  termsLines.forEach(function(ln,li){ doc.text(ln, margin+12, y+18+li*12); });
  y += termsBoxH;

  // ---- signature block ----
  if(y + 70 > bottomLimit) startNewPage();
  y += 46;
  doc.setDrawColor(160);
  doc.line(margin, y, margin+170, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90);
  doc.text("Authorised Signatory", margin, y+13);
  doc.text("For "+(state.settings.companyName||"DECRR Interio"), margin, y-8);

  drawFooter();
  return doc.output("blob");
}
// Plain browser download via a temporary object URL — works in any normal browser tab
// (including this app hosted on a regular web page), unlike the old window.claude.use("downloads")
// API which only existed inside a Claude Artifact sandbox and is not present here.
function triggerBrowserDownload(filename, data, mimeType){
  var blob = (data instanceof Blob) ? data : new Blob([data], {type: mimeType || "application/octet-stream"});
  var url = URL.createObjectURL(blob);

// Editing a past receipt can change its material, quantity, or the PO it's linked to. To keep the
// PO's received-quantity tracking correct, we always fully revert the old receipt's contribution
// first, then apply the new one — this handles every case (same PO, different PO, unlinked, or a
// different material) without double-counting.
function updateReceivedTransaction(id, payload){
  var old = state.transactions.filter(function(t){return t.id===id;})[0];
  if(!old){ toast("Entry not found.","danger"); return Promise.resolve(false); }
  var mat = materialById(payload.materialId);
  if(!mat){ toast("Select a material.","danger"); return Promise.resolve(false); }
  if(!(num(payload.qty,0)>0)){ toast("Enter a quantity greater than 0.","danger"); return Promise.resolve(false); }

  var touchedPOs = {};
  if(old.poId){
    var oldPo = state.purchaseOrders.filter(function(p){return p.id===old.poId;})[0];
    if(oldPo){
      var oldItem = oldPo.items.filter(function(it){return it.materialId===old.materialId;})[0];
      if(oldItem) oldItem.receivedQty = round2(Math.max(0, num(oldItem.receivedQty,0) - num(old.qty,0)));
      touchedPOs[oldPo.id] = oldPo;
    }
  }
  var newPoId = payload.poId || "";
  var newPo = newPoId ? state.purchaseOrders.filter(function(p){return p.id===newPoId;})[0] : null;
  if(newPo){
    var newItem = newPo.items.filter(function(it){return it.materialId===payload.materialId;})[0];
    if(newItem) newItem.receivedQty = round2(num(newItem.receivedQty,0) + num(payload.qty,0));
    touchedPOs[newPo.id] = newPo;
  }
  Object.keys(touchedPOs).forEach(function(pid){ touchedPOs[pid].status = computePoStatus(touchedPOs[pid]); });

  var data = Object.assign({}, old, {
    materialId: payload.materialId, materialName: mat.name, qty: num(payload.qty,0), rate: num(payload.rate,0),
    poId: newPoId, poNumber: newPo?newPo.poNumber:"", date: payload.date||old.date, remark: (payload.remark||"").trim()
  });
  return persist("transactions", id, data).then(function(){
    return Promise.all(Object.keys(touchedPOs).map(function(pid){ return persist("purchaseOrders", pid, touchedPOs[pid]); }));
  }).then(function(){ toast("Receipt updated."); if(!state.db) render(); return true; }).catch(function(){ return false; });
}
// Deleting a receipt also has to give back what it added to the linked PO's received quantity.
function deleteTransactionEntry(id){
  var t = state.transactions.filter(function(x){return x.id===id;})[0]; if(!t) return;
  var kindLabel = t.type==="received" ? "receipt" : "issue";
  var extra = (t.type==="received" && t.poId) ? " and the linked purchase order's received quantity" : "";
  if(!confirmAction("Delete this "+kindLabel+" of "+fmtNum(t.qty)+" "+(t.materialName||"")+"? This will adjust stock levels"+extra+".")) return;

  var poToUpdate = null;
  if(t.type==="received" && t.poId){
    var po = state.purchaseOrders.filter(function(p){return p.id===t.poId;})[0];
    if(po){
      var item = po.items.filter(function(it){return it.materialId===t.materialId;})[0];
      if(item) item.receivedQty = round2(Math.max(0, num(item.receivedQty,0) - num(t.qty,0)));
      po.status = computePoStatus(po);
      poToUpdate = po;
    }
  }
  persist("transactions", id, null, true).then(function(){
    if(poToUpdate) return persist("purchaseOrders", poToUpdate.id, poToUpdate);
  }).then(function(){ toast("Entry deleted."); if(!state.db) render(); });
}

var app = document.getElementById("app");

function withFocusPreserved(fn){
  var active = document.activeElement;
  var restore = null;
  if(active && app.contains(active) && active.id){
    restore = {id:active.id, start:(typeof active.selectionStart==="number"?active.selectionStart:null), end:(typeof active.selectionEnd==="number"?active.selectionEnd:null), scroll: active.scrollTop};
  }
  var scrollY = window.scrollY;
  var contentEl = document.getElementById("content");
  var contentScroll = contentEl? contentEl.scrollTop : 0;
  fn();
  var newContent = document.getElementById("content");
  if(newContent) newContent.scrollTop = contentScroll;
  if(restore){
    var el = document.getElementById(restore.id);
    if(el){
      el.focus();
      if(restore.start!==null && el.setSelectionRange){ try{ el.setSelectionRange(restore.start, restore.end); }catch(e){} }
    }
  }
}
