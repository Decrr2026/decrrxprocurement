/* ============================= PAGE: purchase orders ============================= */
var GST_SLABS = [0,5,12,18,28];
function ensureBuilder(prefillMaterialId){
  if(!state.ui.pos.builder){
    state.ui.pos.builder = { vendorId:"", date: todayISO(), siteId:"", terms: DEFAULT_PO_TERMS, items:[{materialId: prefillMaterialId||"", qty:"", rate: prefillMaterialId? (materialById(prefillMaterialId)||{}).purchaseRate : "", gstPct:18, remark:""}] };
  } else if(prefillMaterialId){
    state.ui.pos.builder.items = [{materialId:prefillMaterialId, qty:"", rate:(materialById(prefillMaterialId)||{}).purchaseRate||"", gstPct:18, remark:""}];
  }
  return state.ui.pos.builder;
}
function poBuilderTotals(items){
  var subtotal=0, gst=0;
  items.forEach(function(it){
    var t = num(it.qty,0)*num(it.rate,0);
    subtotal += t;
    gst += t*num(it.gstPct,0)/100;
  });
  return {subtotal:subtotal, gst:gst, grand:subtotal+gst};
}
function pagePOs(){
  var ui = state.ui.pos;
  var builder = ensureBuilder();
  var vendorOpts = state.vendors.map(function(v){return '<option value="'+v.id+'" '+(builder.vendorId===v.id?"selected":"")+'>'+esc(v.name)+'</option>';}).join("");
  var matOpts = function(sel){ return state.materials.map(function(m){return '<option value="'+m.id+'" '+(sel===m.id?"selected":"")+'>'+esc(m.name)+' ('+esc(m.uom)+')</option>';}).join(""); };

  var itemRows = builder.items.map(function(it,idx){
    var taxable = num(it.qty,0)*num(it.rate,0);
    var lineTotal = taxable + taxable*num(it.gstPct,0)/100;
    var gstOpts = GST_SLABS.map(function(g){ return '<option value="'+g+'" '+(num(it.gstPct,18)===g?"selected":"")+'>'+g+'%</option>'; }).join("");
    var itMat = materialById(it.materialId);
    var descHtml = itMat && itMat.description ? '<div class="cell-muted" style="font-size:11px;margin-top:4px;max-width:180px;white-space:normal;">'+esc(itMat.description)+'</div>' : "";
    return '<tr data-idx="'+idx+'">' +
      '<td><select class="po-item-material" data-idx="'+idx+'"><option value="">Select material</option>'+matOpts(it.materialId)+'</select>'+descHtml+'</td>' +
      '<td><input class="po-item-qty" data-idx="'+idx+'" type="number" min="0" step="any" value="'+esc(it.qty)+'" style="width:80px;"></td>' +
      '<td><input class="po-item-rate" data-idx="'+idx+'" type="number" min="0" step="any" value="'+esc(it.rate)+'" style="width:100px;"></td>' +
      '<td><select class="po-item-gst" data-idx="'+idx+'" style="width:80px;">'+gstOpts+'</select></td>' +
      '<td class="right num" id="poLineTotal_'+idx+'">'+fmtCurrency(lineTotal)+'</td>' +
      '<td><input class="po-item-remark" data-idx="'+idx+'" placeholder="e.g. urgent, sample first" value="'+esc(it.remark||"")+'" style="width:160px;"></td>' +
      '<td class="right"><button type="button" class="iconbtn danger" data-action="po-remove-row" data-idx="'+idx+'" '+(builder.items.length<2?"disabled":"")+'>&#10005;</button></td>' +
    '</tr>';
  }).join("");
  var builderTotals = poBuilderTotals(builder.items);

  var isEditingPo = !!builder.id;
  var builderHtml = '<div class="card card-pad">' +
    '<div class="section-head"><div><h2>'+(isEditingPo?"Edit Purchase Order":"Create Purchase Order")+'</h2><div class="hint">'+(isEditingPo?('Editing <b class="num">'+esc(builder.poNumber||"")+'</b>'):('Next PO number: <b class="num">'+esc(nextPoNumber())+'</b>'))+'</div></div></div>' +
    '<div class="form-grid" style="grid-template-columns:2fr 1fr 1fr;">' +
      '<div class="field"><label for="poVendor">Vendor <span class="req">*</span></label>' +
        '<div style="display:flex;gap:8px;">' +
          '<select id="poVendor" style="flex:1;">'+ '<option value="" disabled '+(builder.vendorId?"":"selected")+'>Select vendor</option>' +vendorOpts+'</select>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="open-quick-add-vendor" style="white-space:nowrap;">+ Add Vendor</button>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label for="poDate">Date <span class="req">*</span></label><input id="poDate" type="date" value="'+esc(builder.date)+'"></div>' +
      '<div class="field"><label for="poSite">Issue / Delivery Site</label><select id="poSite"><option value="" '+(builder.siteId?"":"selected")+'>No specific site</option>'+(state.settings.sites||[]).map(function(s){return '<option value="'+esc(s)+'" '+(builder.siteId===s?"selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select></div>' +
    '</div>' +
    '<div class="table-wrap po-items-table" style="margin-top:14px;"><table><thead><tr><th>Material</th><th>Qty</th><th>Rate</th><th>GST %</th><th class="right">Amount (incl. GST)</th><th>Remarks</th><th></th></tr></thead><tbody id="poItemsBody">'+itemRows+'</tbody></table></div>' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:12px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-action="po-add-row">+ Add Line</button>' +
      '<div style="font-family:\'Manrope\';text-align:right;">' +
        '<div class="cell-muted" style="margin-bottom:2px;">Subtotal: <span id="poSubtotal" class="num">'+fmtCurrency(builderTotals.subtotal)+'</span></div>' +
        '<div class="cell-muted" style="margin-bottom:6px;">GST: <span id="poGstTotal" class="num">'+fmtCurrency(builderTotals.gst)+'</span></div>' +
        '<div style="font-weight:700;font-size:15px;">Grand Total: <span id="poGrandTotal" class="num">'+fmtCurrency(builderTotals.grand)+'</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="field" style="margin-top:16px;"><label for="poTerms">Remarks / Notes / Terms &amp; Conditions <span class="req">*</span></label>' +
      '<textarea id="poTerms" rows="4" required placeholder="Delivery, payment, quality or any other terms for this order…">'+esc(builder.terms)+'</textarea>' +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-primary" data-action="po-submit">'+(isEditingPo?"&#10003; Update Purchase Order":"+ Create Purchase Order")+'</button><button class="btn btn-ghost" data-action="po-reset">'+(isEditingPo?"Cancel Edit":"Clear")+'</button></div>' +
  '</div>';

  var ui2 = ui;
  var statusOpts = ["All","Placed","Partial","Received","Cancelled"];
  var toolbar = '<div class="toolbar">' +
    '<div class="search-box"><span class="ic">&#128269;</span><input id="poSearch" placeholder="Search PO number or vendor…" value="'+esc(ui2.search)+'"></div>' +
    '<select id="poStatusFilter">'+statusOpts.map(function(s){return '<option '+(ui2.statusFilter===s?"selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select>' +
  '</div>';

  return builderHtml +
  '<div class="card card-pad" style="margin-top:16px;">' +
    '<div class="section-head"><h2>Purchase Order List</h2></div>' +
    toolbar +
    '<div id="poListContainer" style="margin-top:14px;">'+renderPoList()+'</div>' +
  '</div>';
}
function poStatusTone(s){ return s==="Received"?"green":s==="Partial"?"amber":s==="Cancelled"?"grey":"blue"; }
function renderPoList(){
  var ui = state.ui.pos;
  var rows = state.purchaseOrders.filter(function(p){
    var q = ui.search.toLowerCase();
    var matchSearch = !q || p.poNumber.toLowerCase().indexOf(q)>-1 || vendorName(p.vendorId).toLowerCase().indexOf(q)>-1;
    var matchStatus = ui.statusFilter==="All" || p.status===ui.statusFilter;
    return matchSearch && matchStatus;
  }).sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  if(!rows.length) return emptyState("No purchase orders found.","&#128196;");
  var body = rows.map(function(p){
    return '<tr>' +
      '<td><b class="num">'+esc(p.poNumber)+'</b></td>' +
      '<td>'+fmtDate(p.date)+'</td>' +
      '<td>'+esc(vendorName(p.vendorId))+'</td>' +
      '<td class="cell-muted">'+(p.siteId?esc(p.siteId):"—")+'</td>' +
      '<td class="cell-muted">'+p.items.length+' item'+(p.items.length!==1?"s":"")+'</td>' +
      '<td class="right num">'+fmtCurrency(poItemsTotal(p))+'</td>' +
      '<td>'+statusBadge(poStatusTone(p.status),p.status)+'</td>' +
      '<td class="right"><div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="iconbtn accent" title="View" data-action="view-po" data-id="'+p.id+'">&#128065;</button>' +
        (p.status!=="Received" && p.status!=="Cancelled"? '<button class="iconbtn" title="Edit" data-action="edit-po" data-id="'+p.id+'">&#9998;</button>' : '') +
        '<button class="iconbtn" title="Download PDF" data-action="download-po-pdf" data-id="'+p.id+'">&#128196;</button>' +
        '<button class="iconbtn" title="Email to vendor" data-action="email-po" data-id="'+p.id+'">&#9993;</button>' +
        (p.status!=="Received" && p.status!=="Cancelled"? '<button class="iconbtn" title="Cancel PO" data-action="cancel-po" data-id="'+p.id+'">&#10005;</button>':'') +
      '</div></td>' +
    '</tr>';
  }).join("");
  return '<div class="table-wrap"><table><thead><tr><th>PO No.</th><th>Date</th><th>Vendor</th><th>Site / Place</th><th>Items</th><th class="right">Total Value</th><th>Status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ============================= PAGE: receive material ============================= */
function pageReceive(){
  var ui = state.ui.receive;
  var editingTxn = ui.editingId ? state.transactions.filter(function(t){return t.id===ui.editingId;})[0] : null;
  var editing = !!editingTxn;
  var openPOs = state.purchaseOrders.filter(function(p){return p.status==="Placed"||p.status==="Partial";});
  if(editingTxn && editingTxn.poId && !openPOs.some(function(p){return p.id===editingTxn.poId;})){
    var lockedPo = state.purchaseOrders.filter(function(p){return p.id===editingTxn.poId;})[0];
    if(lockedPo) openPOs = openPOs.concat([lockedPo]);
  }
  var poOpts = '<option value="">No PO — direct receipt</option>' + openPOs.map(function(p){return '<option value="'+p.id+'" '+(ui.poId===p.id?"selected":"")+'>'+esc(p.poNumber)+' — '+esc(vendorName(p.vendorId))+'</option>';}).join("");
  var selectedPo = openPOs.filter(function(p){return p.id===ui.poId;})[0];
  var matChoices = selectedPo ? selectedPo.items.filter(function(it){return num(it.qty,0)-num(it.receivedQty,0)>0 || it.materialId===ui.materialId;}).map(function(it){return {id:it.materialId, name:it.materialName, pending:num(it.qty,0)-num(it.receivedQty,0)};}) : state.materials.map(function(m){return {id:m.id,name:m.name,pending:null};});
  var matOpts = '<option value="">Select material</option>' + matChoices.map(function(m){return '<option value="'+m.id+'" '+(ui.materialId===m.id?"selected":"")+'>'+esc(m.name)+(m.pending!==null?(" — pending "+fmtNum(m.pending)):"")+'</option>';}).join("");
  var mat = materialById(ui.materialId);

  var poPreview = "";
  if(selectedPo){
    poPreview = '<div class="card-pad" style="background:var(--surface-2);border-radius:8px;margin-top:2px;">' +
      '<div class="cell-muted" style="margin-bottom:6px;">'+esc(selectedPo.poNumber)+' items</div>' +
      selectedPo.items.map(function(it){ var pending=num(it.qty,0)-num(it.receivedQty,0); return '<div class="stat-line"><span>'+esc(it.materialName)+'</span><b>'+fmtNum(it.receivedQty)+' / '+fmtNum(it.qty)+' received'+(pending>0?(' · '+fmtNum(pending)+' pending'):' · complete')+'</b></div>'; }).join("") +
    '</div>';
  }

  return '<div class="card card-pad">' +
    '<div class="section-head"><div><h2>'+(editing?"Edit Received Entry":"Receive Material")+'</h2><div class="hint">'+(editing?"Editing an existing receipt — saving will adjust stock and the linked purchase order's received quantity accordingly.":"Log stock received from a vendor — against a purchase order, or directly.")+'</div></div></div>' +
    '<form novalidate data-form="receive">' +
      '<div class="form-grid">' +
        '<div class="field" style="grid-column:span 1;"><label for="rcvPo">Purchase Order</label><select id="rcvPo">'+poOpts+'</select></div>' +
        '<div class="field"><label for="rcvMaterial">Material <span class="req">*</span></label><select id="rcvMaterial" required>'+matOpts+'</select></div>' +
        '<div class="field"><label for="rcvDate">Date <span class="req">*</span></label><input id="rcvDate" type="date" value="'+esc(ui.date)+'" required></div>' +
        '<div class="field"><label for="rcvQty">Quantity <span class="req">*</span></label><input id="rcvQty" type="number" min="0" step="any" placeholder="Enter quantity" value="'+esc(ui.qty)+'" required></div>' +
        '<div class="field"><label for="rcvRate">Purchase Rate</label><input id="rcvRate" type="number" min="0" step="any" placeholder="0.00" value="'+esc(ui.rate || (mat?mat.purchaseRate:""))+'"></div>' +
        '<div class="field"><label for="rcvValue">Total Value</label><input id="rcvValue" disabled value="'+fmtCurrency(num(ui.qty,0)*num(ui.rate|| (mat?mat.purchaseRate:0),0))+'"></div>' +
        '<div class="field" style="grid-column:span 3;"><label for="rcvRemark">Remark</label><input id="rcvRemark" placeholder="e.g. Received from vendor, Invoice #123" value="'+esc(ui.remark)+'"></div>' +
      '</div>' +
      poPreview +
      '<div style="display:flex;gap:10px;margin-top:14px;"><button type="submit" class="btn btn-primary">'+(editing?"&#10003; Update Receipt":"+ Record Receipt")+'</button>' +
        (editing? '<button type="button" class="btn btn-ghost" data-action="reset-receive">Cancel Edit</button>' : '<button type="reset" class="btn btn-ghost" data-action="reset-receive">Clear</button>') +
      '</div>' +
    '</form>' +
  '</div>' +
  '<div class="card card-pad" style="margin-top:16px;">' +
    '<div class="section-head"><h2>Recent Receipts</h2></div>' +
    renderRecentTxns("received") +
  '</div>';
}
function renderRecentTxns(type){
  var rows = state.transactions.filter(function(t){return t.type===type;}).sort(function(a,b){return (b.createdAt||b.date||"").localeCompare(a.createdAt||a.date||"");}).slice(0,20);
  if(!rows.length) return emptyState("No entries yet.","&#128203;");
  var body = rows.map(function(t){
    return '<tr><td>'+fmtDate(t.date)+'</td><td><b>'+esc(t.materialName)+'</b></td><td class="right num">'+fmtNum(t.qty)+'</td><td class="right num">'+fmtCurrency(num(t.qty,0)*num(t.rate,0))+'</td><td class="cell-muted">'+esc(t.poNumber||"—")+'</td><td class="cell-muted">'+esc(t.remark||"")+'</td>' +
      '<td class="right"><div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="iconbtn" title="Edit" data-action="edit-received-txn" data-id="'+t.id+'">&#9998;</button>' +
        '<button class="iconbtn danger" title="Delete" data-action="delete-txn" data-id="'+t.id+'">&#128465;</button>' +
      '</div></td></tr>';
  }).join("");
  return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Material</th><th class="right">Qty</th><th class="right">Value</th><th>PO Ref.</th><th>Remark</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ============================= PAGE: issue material ============================= */
function pageIssue(){
  var ui = state.ui.issue;
  var editing = !!ui.editingId;
  var matOpts = '<option value="">Select material</option>' + state.materials.map(function(m){ var c=stockFor(m.id).closing; return '<option value="'+m.id+'" '+(ui.materialId===m.id?"selected":"")+'>'+esc(m.name)+' — '+fmtNum(c)+' '+esc(m.uom)+' in stock</option>'; }).join("");
  var mat = materialById(ui.materialId);
  var avail = mat? stockFor(mat.id).closing : null;
  var siteOpts = '<option value="">Select site</option>' + (state.settings.sites||[]).map(function(s){return '<option value="'+esc(s)+'" '+(ui.siteId===s?"selected":"")+'>'+esc(s)+'</option>';}).join("");
  return '<div class="card card-pad">' +
    '<div class="section-head"><div><h2>'+(editing?"Edit Issued Entry":"Issue Material")+'</h2><div class="hint">'+(editing?"Editing an existing issue — saving will adjust available stock accordingly.":"Log material issued out to a site or project. Reduces available stock.")+'</div></div></div>' +
    '<form novalidate data-form="issue">' +
      '<div class="form-grid">' +
        '<div class="field"><label for="issMaterial">Material <span class="req">*</span></label><select id="issMaterial" required>'+matOpts+'</select></div>' +
        '<div class="field"><label for="issQty">Quantity <span class="req">*</span></label><input id="issQty" type="number" min="0" step="any" placeholder="Enter quantity" value="'+esc(ui.qty)+'" required></div>' +
        '<div class="field"><label for="issDate">Date <span class="req">*</span></label><input id="issDate" type="date" value="'+esc(ui.date)+'" required></div>' +
        '<div class="field"><label for="issSite">Site</label><select id="issSite">'+siteOpts+'</select></div>' +
        '<div class="field" style="grid-column:span 2;"><label for="issRemark">Remark</label><input id="issRemark" placeholder="Optional note" value="'+esc(ui.remark)+'"></div>' +
      '</div>' +
      (mat? '<div class="cell-muted" style="margin-top:10px;">Currently available: <b class="num">'+fmtNum(avail)+' '+esc(mat.uom)+'</b></div>' : '') +
      '<div style="display:flex;gap:10px;margin-top:14px;"><button type="submit" class="btn btn-primary">'+(editing?"&#10003; Update Issue":"+ Record Issue")+'</button>' +
        (editing? '<button type="button" class="btn btn-ghost" data-action="reset-issue">Cancel Edit</button>' : '<button type="reset" class="btn btn-ghost" data-action="reset-issue">Clear</button>') +
      '</div>' +
    '</form>' +
  '</div>' +
  '<div class="card card-pad" style="margin-top:16px;">' +
    '<div class="section-head"><h2>Issue History</h2><div class="hint">Every material issued out, filterable site / place wise.</div></div>' +
    '<div class="toolbar">' +
      '<div class="search-box"><span class="ic">&#128269;</span><input id="issueLogSearch" placeholder="Search material or remark…" value="'+esc(state.ui.issueLog.search)+'"></div>' +
      '<select id="issueLogSiteFilter">'+["All"].concat(state.settings.sites||[]).map(function(s){return '<option value="'+esc(s)+'" '+(state.ui.issueLog.siteFilter===s?"selected":"")+'>'+(s==="All"?"All Sites / Places":esc(s))+'</option>';}).join("")+'</select>' +
    '</div>' +
    '<div id="issueListContainer" style="margin-top:14px;">'+renderIssueList()+'</div>' +
  '</div>';
}
function renderIssueList(){
  var ui = state.ui.issueLog;
  var q = (ui.search||"").toLowerCase();
  var rows = state.transactions.filter(function(t){
    if(t.type!=="issued") return false;
    var matchSearch = !q || (t.materialName||"").toLowerCase().indexOf(q)>-1 || (t.remark||"").toLowerCase().indexOf(q)>-1;
    var matchSite = !ui.siteFilter || ui.siteFilter==="All" || t.siteId===ui.siteFilter;
    return matchSearch && matchSite;
  }).sort(function(a,b){return (b.createdAt||b.date||"").localeCompare(a.createdAt||a.date||"");});
  var totalIssued = state.transactions.filter(function(t){return t.type==="issued";}).length;
  if(!rows.length) return emptyState("No issues match your filters.","&#128203;");
  var shown = rows.slice(0,50);
  var body = shown.map(function(t){
    return '<tr><td>'+fmtDate(t.date)+'</td><td><b>'+esc(t.materialName)+'</b></td><td class="right num">'+fmtNum(t.qty)+'</td><td class="right num">'+fmtCurrency(num(t.qty,0)*num(t.rate,0))+'</td><td class="cell-muted">'+esc(t.siteId||"—")+'</td><td class="cell-muted">'+esc(t.remark||"")+'</td>' +
      '<td class="right"><div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="iconbtn" title="Edit" data-action="edit-issued-txn" data-id="'+t.id+'">&#9998;</button>' +
        '<button class="iconbtn danger" title="Delete" data-action="delete-txn" data-id="'+t.id+'">&#128465;</button>' +
      '</div></td></tr>';
  }).join("");
  return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Material</th><th class="right">Qty</th><th class="right">Value</th><th>Site / Place</th><th>Remark</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>' +
    '<div class="cell-muted" style="margin-top:10px;">Showing '+shown.length+' of '+rows.length+' matching issues ('+totalIssued+' total)</div>';
}

/* ============================= PAGE: inventory ============================= */
function pageInventory(){
  var totalItems = state.materials.length;
  var totalValue = totalStockValue();
  var lowCount=0, outCount=0;
  state.materials.forEach(function(m){ var c=stockFor(m.id).closing; var s=stockStatus(m,c); if(s.label==="Low Stock") lowCount++; if(s.label==="Out of Stock") outCount++; });

  var kpis = '<div class="grid kpi-row">' +
    kpiCard("blue","&#128230;",fmtNum(totalItems),"Total Items in Stock Master") +
    kpiCard("green","&#128176;",fmtCurrency(totalValue),"Total Stock Value") +
    kpiCard("amber","&#9888;",fmtNum(lowCount),"Low Stock Items (Below Reorder Level)") +
    kpiCard("red","&#10060;",fmtNum(outCount),"Out of Stock (Zero Quantity)") +
  '</div>';

  var ui = state.ui.inventory;
  var tabs = ["received","opening","adjust"];
  var tabLabels = {received:"Received Stock", opening:"Opening Stock", adjust:"Adjust Stock"};
  var matOpts = '<option value="">Search or select material</option>' + state.materials.map(function(m){return '<option value="'+m.id+'" '+(ui.entry.materialId===m.id?"selected":"")+'>'+esc(m.name)+'</option>';}).join("");
  var mat = materialById(ui.entry.materialId);

  var entryFields = "";
  if(ui.tab==="received"){
    var openPOs = state.purchaseOrders.filter(function(p){return (p.status==="Placed"||p.status==="Partial") && (!mat || p.items.some(function(it){return it.materialId===mat.id;}));});
    var poOpts = '<option value="">Select PO (optional)</option>' + openPOs.map(function(p){return '<option value="'+p.id+'" '+(ui.entry.poId===p.id?"selected":"")+'>'+esc(p.poNumber)+'</option>';}).join("");
    entryFields = '<div class="field"><label for="invPo">PO No.</label><select id="invPo">'+poOpts+'</select></div>' +
      '<div class="field"><label for="invQty">Quantity <span class="req">*</span></label><input id="invQty" type="number" min="0" step="any" placeholder="Enter quantity" value="'+esc(ui.entry.qty)+'"></div>' +
      '<div class="field"><label for="invRate">Purchase Rate</label><input id="invRate" type="number" min="0" step="any" value="'+esc(ui.entry.rate||(mat?mat.purchaseRate:""))+'"></div>';
  } else if(ui.tab==="opening"){
    entryFields = '<div class="field"><label for="invQty">Opening Quantity <span class="req">*</span></label><input id="invQty" type="number" min="0" step="any" placeholder="Enter quantity" value="'+esc(ui.entry.qty)+'"></div>' +

function renderInventoryList(){

    var matchSearch = !q || r.m.name.toLowerCase().indexOf(q)>-1;

    return matchSearch && matchStatus;
  });
  if(!rows.length) return emptyState("No stock records match your filters.","&#128230;");

    var value = r.s.closing * num(r.m.purchaseRate,0);
    return '<tr>' +
      '<td class="cell-muted">'+(i+1)+'</td>' +
      '<td><b>'+esc(r.m.name)+'</b></td>' +
      '<td><span class="type-chip">'+esc(r.m.type)+'</span></td>' +
      '<td>'+esc(r.m.uom)+'</td>' +
      '<td class="right num">'+fmtNum(r.s.opening)+'</td>' +
      '<td class="right num">'+fmtNum(r.s.received)+'</td>' +
      '<td class="right num">'+fmtNum(r.s.issued)+'</td>' +
      '<td class="right num"><b>'+fmtNum(r.s.closing)+'</b></td>' +
      '<td class="right num">'+fmtCurrency(r.m.purchaseRate)+'</td>' +
      '<td class="right num">'+fmtCurrency(value)+'</td>' +
      '<td>'+statusBadge(r.st.tone,r.st.label)+'</td>' +
      '<td class="right"><div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="iconbtn accent" title="View ledger" data-action="view-ledger" data-id="'+r.m.id+'">&#128065;</button>' +
        '<button class="iconbtn" title="Edit material" data-action="goto-edit-material" data-id="'+r.m.id+'">&#9998;</button>' +
        '<button class="iconbtn danger" title="Clear stock ledger" data-action="reset-material-stock" data-id="'+r.m.id+'">&#128465;</button>' +

    '<div class="cell-muted" style="margin-top:10px;">Showing '+rows.length+' of '+state.materials.length+' items</div>';

/* ============================= PAGE: reports ============================= */
function pageReports(){
  var ui = state.ui.reports;
  var tabs = [["valuation","Stock Valuation"],["lowstock","Low Stock"],["pos","Purchase Order Summary"],["ledger","Material Ledger"]];
  var tabBar = '<div class="pill-tabs">'+tabs.map(function(t){return '<button class="pill-tab'+(ui.tab===t[0]?" active":"")+'" data-action="reports-tab" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';
  var body = "";

    '<div class="section-head"><div><h2>Reports</h2><div class="hint">Export any report to CSV for record-keeping or sharing.</div></div></div>' +

function csvExportBtn(reportKey,label){ return '<button class="btn btn-ghost btn-sm" data-action="export-csv" data-report="'+reportKey+'">&#8659; '+esc(label||"Export CSV")+'</button>'; }
function reportValuation(){
  var rows = state.materials.map(function(m){ var s=stockFor(m.id); return {m:m,s:s,value:s.closing*num(m.purchaseRate,0)}; });
  var total = rows.reduce(function(sum,r){return sum+r.value;},0);
  var body = rows.map(function(r,i){ return '<tr><td class="cell-muted">'+(i+1)+'</td><td><b>'+esc(r.m.name)+'</b></td><td>'+esc(r.m.type)+'</td><td class="right num">'+fmtNum(r.s.closing)+' '+esc(r.m.uom)+'</td><td class="right num">'+fmtCurrency(r.m.purchaseRate)+'</td><td class="right num"><b>'+fmtCurrency(r.value)+'</b></td></tr>'; }).join("");
  return '<div class="section-head"><div class="hint">Current closing stock valued at purchase rate.</div>'+csvExportBtn("valuation")+'</div>' +
    '<div class="table-wrap"><table><thead><tr><th>S.No</th><th>Material</th><th>Type</th><th class="right">Closing Stock</th><th class="right">Rate</th><th class="right">Value</th></tr></thead><tbody>'+body+
    '<tr style="font-weight:700;"><td colspan="5" class="right">Total Stock Value</td><td class="right num">'+fmtCurrency(total)+'</td></tr></tbody></table></div>';
}
function reportLowStock(){
  var rows = state.materials.map(function(m){ var s=stockFor(m.id); var st=stockStatus(m,s.closing); return {m:m,s:s,st:st}; }).filter(function(r){return r.st.label!=="In Stock";});
  if(!rows.length) return emptyState("Nothing below reorder level right now — all materials are in stock.","&#9989;");
  var body = rows.map(function(r,i){ return '<tr><td class="cell-muted">'+(i+1)+'</td><td><b>'+esc(r.m.name)+'</b></td><td class="right num">'+fmtNum(r.s.closing)+' '+esc(r.m.uom)+'</td><td class="right num">'+fmtNum(reorderLevel(r.m))+'</td><td>'+statusBadge(r.st.tone,r.st.label)+'</td><td class="right"><button class="btn btn-ghost btn-sm" data-action="goto-po-for" data-id="'+r.m.id+'">Create PO</button></td></tr>'; }).join("");
  return '<div class="section-head"><div class="hint">Materials at or below their reorder level.</div>'+csvExportBtn("lowstock")+'</div>' +
    '<div class="table-wrap"><table><thead><tr><th>S.No</th><th>Material</th><th class="right">Closing Stock</th><th class="right">Reorder Level</th><th>Status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function reportPOs(){
  var rows = state.purchaseOrders.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
  var totalVal = rows.reduce(function(s,p){return s+poItemsTotal(p);},0);
  var body = rows.map(function(p,i){ return '<tr><td class="cell-muted">'+(i+1)+'</td><td class="num"><b>'+esc(p.poNumber)+'</b></td><td>'+fmtDate(p.date)+'</td><td>'+esc(vendorName(p.vendorId))+'</td><td class="right num">'+fmtCurrency(poItemsTotal(p))+'</td><td class="right num">'+fmtCurrency(poReceivedTotal(p))+'</td><td>'+statusBadge(poStatusTone(p.status),p.status)+'</td></tr>'; }).join("");
  return '<div class="section-head"><div class="hint">All purchase orders raised to date.</div>'+csvExportBtn("pos")+'</div>' +
    '<div class="table-wrap"><table><thead><tr><th>S.No</th><th>PO No.</th><th>Date</th><th>Vendor</th><th class="right">Order Value</th><th class="right">Received Value</th><th>Status</th></tr></thead><tbody>'+body+
    '<tr style="font-weight:700;"><td colspan="4" class="right">Total</td><td class="right num">'+fmtCurrency(totalVal)+'</td><td></td><td></td></tr></tbody></table></div>';
}
function reportLedger(){
  var ui = state.ui.reports;
  var matOpts = '<option value="">Select a material</option>' + state.materials.map(function(m){return '<option value="'+m.id+'" '+(ui.ledgerMaterialId===m.id?"selected":"")+'>'+esc(m.name)+'</option>';}).join("");
  var head = '<div class="section-head"><div class="field" style="max-width:320px;"><label for="ledgerMaterialSelect">Material</label><select id="ledgerMaterialSelect">'+matOpts+'</select></div>'+(ui.ledgerMaterialId?csvExportBtn("ledger"):'')+'</div>';
  if(!ui.ledgerMaterialId) return head + emptyState("Pick a material to see its full transaction history.","&#128203;");
  return head + '<div style="margin-top:10px;">'+ledgerTableHtml(ui.ledgerMaterialId)+'</div>';
}
function ledgerTableHtml(materialId){
  var mat = materialById(materialId); if(!mat) return emptyState("Material not found.");
  var rows = materialTxns(materialId).slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"") || (a.createdAt||"").localeCompare(b.createdAt||"");});
  var running = 0;
  var typeLabel = {opening:"Opening",received:"Received",issued:"Issued",adjust:"Adjustment"};
  var typeTone = {opening:"blue",received:"green",issued:"amber",adjust:"grey"};
  var body = rows.map(function(t){
    var delta = t.type==="issued" ? -num(t.qty,0) : num(t.qty,0);
    running = round2(running+delta);
    return '<tr><td>'+fmtDate(t.date)+'</td><td>'+statusBadge(typeTone[t.type]||"grey",typeLabel[t.type]||t.type)+'</td><td class="right num">'+(delta>=0?"+":"")+fmtNum(delta)+'</td><td class="right num"><b>'+fmtNum(running)+'</b></td><td class="cell-muted">'+esc(t.poNumber||"—")+'</td><td class="cell-muted">'+esc(t.remark||"")+'</td></tr>';
  }).join("");
  if(!rows.length) return emptyState("No transactions recorded yet for "+esc(mat.name)+".");
  return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th class="right">Qty Change</th><th class="right">Running Balance</th><th>PO Ref.</th><th>Remark</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function reportRows(reportKey){
  if(reportKey==="valuation") return {headers:["Material","Type","UOM","Closing Stock","Purchase Rate","Stock Value"], rows: state.materials.map(function(m){ var s=stockFor(m.id); return [m.name,m.type,m.uom,s.closing,m.purchaseRate,round2(s.closing*num(m.purchaseRate,0))]; })};
  if(reportKey==="lowstock") return {headers:["Material","UOM","Closing Stock","Reorder Level","Status"], rows: state.materials.map(function(m){var s=stockFor(m.id); var st=stockStatus(m,s.closing); return {row:[m.name,m.uom,s.closing,reorderLevel(m),st.label], keep: st.label!=="In Stock"};}).filter(function(x){return x.keep;}).map(function(x){return x.row;})};
  if(reportKey==="pos") return {headers:["PO Number","Date","Vendor","Order Value","Received Value","Status"], rows: state.purchaseOrders.map(function(p){return [p.poNumber,p.date,vendorName(p.vendorId),round2(poItemsTotal(p)),round2(poReceivedTotal(p)),p.status];})};
  if(reportKey==="ledger"){
    var mid = state.ui.reports.ledgerMaterialId; var mat = materialById(mid);
    var rows = materialTxns(mid).slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");}).map(function(t){ return [t.date, t.type, t.type==="issued"?-num(t.qty,0):num(t.qty,0), t.poNumber||"", t.remark||""]; });
    return {headers:["Date","Type","Qty Change","PO Ref.","Remark"], rows: rows, filename:"ledger_"+(mat?mat.name.replace(/\W+/g,"_"):"material")};
  }
  return {headers:[],rows:[]};
}

function poViewBody(poId){
  var po = state.purchaseOrders.filter(function(p){return p.id===poId;})[0]; if(!po) return emptyState("Purchase order not found.");
  var itemRows = po.items.map(function(it){
    var rawPending = num(it.qty,0)-num(it.receivedQty,0);
    var pending = Math.max(0, rawPending);
    var overReceived = Math.max(0, -rawPending);
    var taxable = num(it.qty,0)*num(it.rate,0);
    var receivedCell = fmtNum(it.receivedQty) + (overReceived>0 ? ' <span class="cell-muted" style="font-size:11px;">(+'+fmtNum(overReceived)+' extra)</span>' : '');
    return '<tr><td><b>'+esc(it.materialName)+'</b></td><td class="right num">'+fmtNum(it.qty)+'</td><td class="right num">'+fmtCurrency(it.rate)+'</td><td class="right num">'+fmtCurrency(taxable)+'</td><td class="right num">'+fmtNum(it.gstPct)+'%</td><td class="right num">'+fmtCurrency(poItemGstAmount(it))+'</td><td class="right num">'+fmtCurrency(taxable+poItemGstAmount(it))+'</td><td class="right num">'+receivedCell+'</td><td class="right num">'+fmtNum(pending)+'</td><td class="cell-muted">'+esc(it.remark||"—")+'</td></tr>';
  }).join("");
  var vendor = state.vendors.filter(function(v){return v.id===po.vendorId;})[0];
  var grandTotal = poItemsGrandTotal(po);
  var bills = poBills(po.id).slice().sort(function(a,b){return (b.billDate||"").localeCompare(a.billDate||"");});
  var billedTotal = poBilledTotal(po.id);
  var billRows = bills.map(function(b){
    return '<tr><td>'+fmtDate(b.billDate)+'</td><td class="cell-muted">'+esc(b.billNumber||"—")+'</td><td class="right num">'+fmtCurrency(b.amount)+'</td><td class="cell-muted">'+esc(b.remark||"—")+'</td>' +
      '<td class="right"><div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="iconbtn" title="Edit" data-action="edit-bill" data-id="'+b.id+'">&#9998;</button>' +
        '<button class="iconbtn danger" title="Delete" data-action="delete-bill" data-id="'+b.id+'">&#128465;</button>' +
      '</div></td></tr>';
  }).join("");
  var billingSection =

function vendorLedgerBody(vendorId){
  var vendor = vendorById(vendorId); if(!vendor) return emptyState("Vendor not found.");
  var summary = vendorPayableSummary(vendorId);
  var entries = vendorLedgerEntries(vendorId);
  var rows = entries.slice().reverse().map(function(e){
    var typeCell = (e.kind==="bill"?"Tax Invoice":"Payment") + (e.remark? (' <div class="cell-muted" style="font-size:11.5px;">'+esc(e.remark)+'</div>') : "");
    var invCell = e.kind==="bill" ? esc(e.billNumber||"—") : "—";
    var delAction = e.kind==="bill" ? "delete-bill" : "delete-payment";
    var editAction = e.kind==="bill" ? "edit-bill" : "edit-payment";
    return '<tr><td>'+fmtDate(e.date)+'</td><td>'+typeCell+'</td><td class="cell-muted">'+invCell+'</td>' +
      '<td class="right num">'+(e.debit>0?fmtCurrency(e.debit):'<span class="cell-muted">—</span>')+'</td>' +
      '<td class="right num">'+(e.credit>0?fmtCurrency(e.credit):'<span class="cell-muted">—</span>')+'</td>' +
      '<td class="right num"><b>'+fmtCurrency(e.balance)+'</b></td>' +
      '<td class="right"><div style="display:flex;gap:6px;justify-content:flex-end;">' +
        '<button class="iconbtn" title="Edit" data-action="'+editAction+'" data-id="'+e.id+'">&#9998;</button>' +
        '<button class="iconbtn danger" title="Delete" data-action="'+delAction+'" data-id="'+e.id+'">&#128465;</button>' +
      '</div></td></tr>';
  }).join("");
  return '<div class="grid" style="grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;">' +
      statTile("Credit Period", fmtNum(vendor.creditPeriodDays!==undefined?vendor.creditPeriodDays:30)+" days") +
      statTile("Balance Due", fmtCurrency(summary.balanceDue)) +
    '</div>' +
    '<div class="stat-line" style="margin-bottom:14px;"><span>Status</span>'+statusBadge(summary.tone,summary.label)+(summary.dueDate?(' <span class="cell-muted" style="margin-left:8px;">Due '+fmtDate(summary.dueDate)+(summary.daysOverdue>0?(' &middot; '+summary.daysOverdue+' day'+(summary.daysOverdue===1?"":"s")+' overdue'):(summary.daysOverdue<0?(' &middot; due in '+(-summary.daysOverdue)+' day'+(summary.daysOverdue===-1?"":"s")):''))+'</span>'):'')+'</div>' +
    '<h4 style="margin-bottom:8px;font-size:13px;">Ledger — Bills (debit) &amp; Payments (credit)</h4>' +
    (entries.length ?
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Invoice No.</th><th class="right">Debit</th><th class="right">Credit</th><th class="right">Balance</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : emptyState("No bills or payments recorded for this vendor yet.")) +
    '<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;">' +
      '<div class="card-pad" style="background:var(--surface-2);border-radius:9px;">' +
        '<div class="cell-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">+ Add Bill (Tax Invoice)</div>' +
        '<form novalidate data-form="add-bill" data-id="" data-vendor-id="'+esc(vendor.id)+'" style="display:grid;gap:8px;">' +
          '<div class="field"><label for="lgBillDate">Invoice (Bill) Date</label><input id="lgBillDate" name="billDate" type="date" value="'+todayISO()+'"></div>' +
          '<div class="field"><label for="lgBillNumber">Invoice / Bill No.</label><input id="lgBillNumber" name="billNumber" placeholder="e.g. INV-1042"></div>' +
          '<div class="field"><label for="lgBillAmount">Amount</label><input id="lgBillAmount" name="amount" type="number" min="0" step="any" placeholder="0.00"></div>' +
          '<div class="field"><label for="lgBillRemark">Remark</label><input id="lgBillRemark" name="remark" placeholder="Optional — e.g. related PO, freight"></div>' +
          '<button type="submit" class="btn btn-primary btn-sm">+ Add Bill</button>' +
        '</form>' +
      '</div>' +
      '<div class="card-pad" style="background:var(--surface-2);border-radius:9px;">' +
        '<div class="cell-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">+ Record Payment</div>' +
        '<form novalidate data-form="record-payment" data-id="'+esc(vendor.id)+'" style="display:grid;gap:8px;">' +
          '<div class="field"><label for="payDate">Date</label><input id="payDate" name="date" type="date" value="'+todayISO()+'"></div>' +
          '<div class="field"><label for="payAmount">Amount</label><input id="payAmount" name="amount" type="number" min="0" step="any" placeholder="'+fmtNum(summary.balanceDue)+'"></div>' +
          '<div class="field"><label for="payRemark">Remark</label><input id="payRemark" name="remark" placeholder="e.g. NEFT ref, cheque no."></div>' +
          '<button type="submit" class="btn btn-primary btn-sm" '+(summary.balanceDue<=0?"disabled":"")+'>+ Record Payment</button>' +
        '</form>' +
      '</div>' +
    '</div>';
}

/* ============================= event handling ============================= */
function readEntry(id){ var el=document.getElementById(id); return el? el.value : ""; }

function bindGlobalHandlers(){
  app.onclick = function(e){
    var t = e.target.closest("[data-action]");
    if(!t){
      if(e.target.closest(".modal-backdrop") && !e.target.closest("[data-stop]")){ state.ui.modal=null; render(); }
      return;
    }
    var action = t.getAttribute("data-action");
    var id = t.getAttribute("data-id");
    // If the resolved action is only the modal-backdrop itself (found by bubbling past a
    // plain element with no data-action of its own, e.g. a bare submit button inside a
    // modal's form), but the actual click originated inside a protected [data-stop] zone
    // (the modal card), it's not a genuine "click outside to close" — ignore it so the
    // form's own submit handler gets a chance to run instead of the modal closing under it.
    if(action==="modal-backdrop" && e.target.closest("[data-stop]")) return;
    switch(action){
      case "toggle-nav": state.ui.navOpen = !state.ui.navOpen; render(); break;
      case "logout": doLogout(); break;
      case "nav":
        state.page = t.getAttribute("data-page"); state.ui.navOpen=false;
        if(state.page==="pos") state.ui.pos.builder=null;
        render(); break;
      case "close-modal": case "modal-backdrop": state.ui.modal=null; render(); break;
      case "open-quick-add-vendor": state.ui.modal = {type:"quick-add-vendor"}; render(); break;
      case "edit-po":
        var poToEdit = state.purchaseOrders.filter(function(p){return p.id===id;})[0];
        if(poToEdit){
          if(poToEdit.status==="Received" || poToEdit.status==="Cancelled"){ toast("This order is "+poToEdit.status.toLowerCase()+" and can't be edited.","danger"); break; }
          state.ui.modal = null;
          state.page = "pos";
          state.ui.pos.builder = {
            id: poToEdit.id, poNumber: poToEdit.poNumber, vendorId: poToEdit.vendorId, date: poToEdit.date, siteId: poToEdit.siteId||"",
            terms: poToEdit.terms,
            items: poToEdit.items.map(function(it){ return Object.assign({}, it); })
          };
          render(); scrollTopOfContent();
        }
        break;

      case "edit-material": state.ui.materials.editingId = id; render(); scrollTopOfContent(); break;
      case "cancel-edit-material": state.ui.materials.editingId = null; render(); break;
      case "delete-material": deleteMaterial(id); break;
      case "goto-edit-material": state.page="materials"; state.ui.materials.editingId=id; render(); break;

      case "edit-vendor": state.ui.vendors.editingId = id; render(); scrollTopOfContent(); break;
      case "cancel-edit-vendor": state.ui.vendors.editingId = null; render(); break;
      case "delete-vendor": deleteVendor(id); break;
      case "delete-payment": deletePayment(id); break;
      case "delete-bill": deleteBill(id); break;
      case "view-vendor-ledger": state.ui.modal = {type:"vendor-ledger", id:id}; render(); break;

      case "bills-tab": state.ui.bills.tab = t.getAttribute("data-tab"); state.ui.bills.editingId = null; render(); break;
      case "edit-bill": state.ui.modal = null; state.page = "bills"; state.ui.bills.tab = "bills"; state.ui.bills.editingId = id; render(); scrollTopOfContent(); break;
      case "cancel-edit-bill": state.ui.bills.editingId = null; render(); break;
      case "edit-payment": state.ui.modal = null; state.page = "bills"; state.ui.bills.tab = "payments"; state.ui.bills.editingId = id; render(); scrollTopOfContent(); break;
      case "cancel-edit-payment": state.ui.bills.editingId = null; render(); break;

      case "view-ledger": state.ui.modal = {type:"ledger", id:id}; render(); break;
      case "view-po": state.ui.modal = {type:"po-view", id:id}; render(); break;
      case "cancel-po": cancelPO(id); break;
      case "download-po-pdf": downloadPoPdf(id); break;
      case "email-po": emailPoToVendor(id); break;
      case "quick-receive-po":
        state.ui.modal = null; state.page="receive"; state.ui.receive.poId=id; state.ui.receive.materialId=""; render(); break;

      case "goto-po-for":
        state.page="pos"; ensureBuilder(id); render(); break;

      case "po-add-row": state.ui.pos.builder.items.push({materialId:"",qty:"",rate:"",gstPct:18,remark:""}); render(); break;
      case "po-remove-row":
        var idx = parseInt(t.getAttribute("data-idx"),10);
        if(state.ui.pos.builder.items.length>1){ state.ui.pos.builder.items.splice(idx,1); render(); }
        break;
      case "po-reset": state.ui.pos.builder=null; render(); break;
      case "po-submit": submitPO(); break;

      case "inv-tab": state.ui.inventory.tab = t.getAttribute("data-tab"); render(); break;
      case "reset-inv-entry": state.ui.inventory.entry={materialId:"",qty:"",rate:"",remark:"",poId:""}; render(); break;
      case "reset-receive": state.ui.receive={materialId:"",poId:"",qty:"",rate:"",remark:"",date:todayISO(),editingId:null}; render(); break;
      case "reset-issue": state.ui.issue={materialId:"",qty:"",siteId:"",remark:"",date:todayISO(),editingId:null}; render(); break;
      case "edit-received-txn":
        var rtxn = state.transactions.filter(function(t){return t.id===id;})[0];
        if(rtxn){ state.ui.receive = {editingId:id, materialId:rtxn.materialId, poId:rtxn.poId||"", qty:rtxn.qty, rate:rtxn.rate, remark:rtxn.remark||"", date:rtxn.date||todayISO()}; render(); scrollTopOfContent(); }
        break;
      case "edit-issued-txn":
        var itxn = state.transactions.filter(function(t){return t.id===id;})[0];
        if(itxn){ state.ui.issue = {editingId:id, materialId:itxn.materialId, qty:itxn.qty, siteId:itxn.siteId||"", remark:itxn.remark||"", date:itxn.date||todayISO()}; render(); scrollTopOfContent(); }
        break;
      case "delete-txn": deleteTransactionEntry(id); break;
      case "reset-material-stock": resetMaterialStock(id); break;

      case "reports-tab": state.ui.reports.tab = t.getAttribute("data-tab"); render(); break;
      case "export-csv": exportReportCsv(t.getAttribute("data-report")); break;

      case "remove-list-item":
        var key = t.getAttribute("data-key"), val = t.getAttribute("data-value");
        var arr = (state.settings[key]||[]).filter(function(x){return x!==val;});
        var patch={}; patch[key]=arr; saveSettings(patch);
        break;
    }
  };

  app.onsubmit = function(e){
    var form = e.target.closest("form"); if(!form) return;
    e.preventDefault();
    var kind = form.getAttribute("data-form");
    if(kind==="login"){
      var loginEmail = (document.getElementById("loginEmail")||{}).value || "";
      var loginPassword = (document.getElementById("loginPassword")||{}).value || "";
      doLogin(loginEmail.trim(), loginPassword);
    } else if(kind==="material"){
      var id = form.getAttribute("data-id")||null;
      var payload = { name:readVal(form,"name").trim(), type:readVal(form,"type"), description:readVal(form,"description").trim(), uom:readVal(form,"uom"), siteRequirement:num(readVal(form,"siteRequirement"),0), purchaseRate:num(readVal(form,"purchaseRate"),0), preferredVendorId:readVal(form,"preferredVendorId")||"" };
      if(!payload.name || !payload.type || !payload.uom){ toast("Please fill in name, type and UOM.","danger"); return; }
      upsertMaterial(id||null, payload);
      state.ui.materials.editingId = null; render();
    } else if(kind==="vendor"){
      var vid = form.getAttribute("data-id")||null;
      var vpayload = { name:readVal(form,"name").trim(), contact:readVal(form,"contact").trim(), phone:readVal(form,"phone").trim(), email:readVal(form,"email").trim(), address:readVal(form,"address").trim(), gstin:readVal(form,"gstin").trim().toUpperCase(), creditPeriodDays:num(readVal(form,"creditPeriodDays"),30) };
      if(!vpayload.name){ toast("Vendor name is required.","danger"); return; }
      upsertVendor(vid||null, vpayload);
      state.ui.vendors.editingId = null; render();
    } else if(kind==="receive"){
      var poId = readEntry("rcvPo"), materialId = readEntry("rcvMaterial"), qty = num(readEntry("rcvQty"),0), rate = num(readEntry("rcvRate"),0), date = readEntry("rcvDate"), remark = readEntry("rcvRemark");
      if(state.ui.receive.editingId){
        updateReceivedTransaction(state.ui.receive.editingId, {materialId:materialId, poId:poId, qty:qty, rate:rate, date:date, remark:remark});
      } else {
        receiveAgainstPO(poId, materialId, qty, rate, date, remark);
      }
      state.ui.receive = {materialId:"",poId:"",qty:"",rate:"",remark:"",date:todayISO(),editingId:null}; render();
    } else if(kind==="issue"){
      var imid = readEntry("issMaterial"), iqty = num(readEntry("issQty"),0), idate = readEntry("issDate"), isite = readEntry("issSite"), irem = readEntry("issRemark");
      if(state.ui.issue.editingId){
        updateIssuedTransaction(state.ui.issue.editingId, {materialId:imid, qty:iqty, date:idate, siteId:isite, remark:irem});
      } else {
        issueMaterial(imid, iqty, idate, isite, irem);
      }
      state.ui.issue = {materialId:"",qty:"",siteId:"",remark:"",date:todayISO(),editingId:null}; render();
    } else if(kind==="inventory-entry"){
      var tab = state.ui.inventory.tab;
      var mId = readEntry("invMaterial"), qtyVal = num(readEntry("invQty"),0), rateVal = num(readEntry("invRate"),0), remarkVal = readEntry("invRemark");
      if(tab==="received"){ receiveAgainstPO(readEntry("invPo"), mId, qtyVal, rateVal, todayISO(), remarkVal); }
      else if(tab==="opening"){ addOpeningStock(mId, qtyVal, rateVal, todayISO(), remarkVal); }
      else { adjustStock(mId, qtyVal, todayISO(), remarkVal); }
      state.ui.inventory.entry = {materialId:"",qty:"",rate:"",remark:"",poId:""}; render();
    } else if(kind==="settings-general"){
      saveSettings({ companyName:readEntry("setCompany").trim()||state.settings.companyName, companyTagline:readEntry("setTagline").trim(), currency:readEntry("setCurrency").trim()||state.settings.currency, lowStockThresholdPct:num(readEntry("setLowPct"),50), partialStockThresholdPct:num(readEntry("setPartialPct"),60), mailReminderDays:num(readEntry("setMailDays"),21), supplyStopDays:num(readEntry("setStopDays"),60), poPrefix:readEntry("setPoPrefix").trim()||state.settings.poPrefix });
    } else if(kind==="add-bill"){
      var billPoId = form.getAttribute("data-id")||"";
      var billVendorId = form.getAttribute("data-vendor-id")||"";
      addBill(billPoId, billVendorId, readVal(form,"billNumber"), readVal(form,"billDate")||todayISO(), num(readVal(form,"amount"),0), readVal(form,"remark")).then(function(ok){ if(ok) render(); });
    } else if(kind==="record-payment"){
      var payVendorId = form.getAttribute("data-id");
      recordPayment(payVendorId, num(readVal(form,"amount"),0), readVal(form,"date")||todayISO(), readVal(form,"remark")).then(function(ok){ if(ok) render(); });
    } else if(kind==="bill-full"){
      var fbId = form.getAttribute("data-id")||null;
      var fbPayload = { vendorId:readVal(form,"vendorId"), poId:readVal(form,"poId")||"", billDate:readVal(form,"billDate")||todayISO(), billNumber:readVal(form,"billNumber").trim(), amount:num(readVal(form,"amount"),0), remark:readVal(form,"remark").trim() };
      upsertBill(fbId, fbPayload);
      state.ui.bills.editingId = null; render();
    } else if(kind==="payment-full"){
      var fpId = form.getAttribute("data-id")||null;
      var fpPayload = { vendorId:readVal(form,"vendorId"), date:readVal(form,"date")||todayISO(), amount:num(readVal(form,"amount"),0), remark:readVal(form,"remark").trim() };
      upsertPayment(fpId, fpPayload);
      state.ui.bills.editingId = null; render();
    } else if(kind==="quick-add-vendor"){
      var qvPayload = { name:readVal(form,"name"), contact:readVal(form,"contact"), phone:readVal(form,"phone"), creditPeriodDays:num(readVal(form,"creditPeriodDays"),30) };
      quickAddVendor(qvPayload).then(function(newId){
        if(newId){ ensureBuilder(); state.ui.pos.builder.vendorId = newId; state.ui.modal = null; render(); }
      });
    } else if(kind==="add-list-item"){
      var key2 = form.getAttribute("data-key");
      var input = document.getElementById("new_"+key2);
      var val2 = input? input.value.trim() : "";
      if(val2){
        var list = (state.settings[key2]||[]).slice();
        if(list.indexOf(val2)===-1){ list.push(val2); var patch2={}; patch2[key2]=list; saveSettings(patch2); }
        else { toast("Already in the list.","danger"); }
      }
    }
  };

  app.onchange = function(e){
    var el = e.target;
    switch(el.id){
      case "matTypeFilter": state.ui.materials.typeFilter = el.value; refreshMaterialList(); return;
      case "matVendorFilter": state.ui.materials.vendorFilter = el.value; refreshMaterialList(); return;
      case "venDuesFilter": state.ui.vendors.duesFilter = el.value; refreshVendorList(); return;
      case "issueLogSiteFilter": state.ui.issueLog.siteFilter = el.value; refreshIssueList(); return;
      case "dashStatusFilter": state.ui.dashboard.statusFilter = el.value; refreshContainer("dashboard"); return;
      case "dashTypeFilter": state.ui.dashboard.typeFilter = el.value; refreshContainer("dashboard"); return;
      case "dashVendorFilter": state.ui.dashboard.vendorFilter = el.value; refreshContainer("dashboard"); return;
      case "dashSiteFilter": state.ui.dashboard.siteFilter = el.value; refreshContainer("dashboard"); return;
      case "dashStockFilter": state.ui.dashboard.stockFilter = el.value; refreshContainer("dashboard"); return;
      case "poStatusFilter": state.ui.pos.statusFilter = el.value; refreshPoList(); return;
      case "invStatusFilter": state.ui.inventory.statusFilter = el.value; refreshInvList(); return;
      case "poVendor": ensureBuilder(); state.ui.pos.builder.vendorId = el.value; return;
      case "poDate": ensureBuilder(); state.ui.pos.builder.date = el.value; return;
      case "poSite": ensureBuilder(); state.ui.pos.builder.siteId = el.value; return;
      case "rcvPo": state.ui.receive.poId = el.value; state.ui.receive.materialId=""; render(); return;
      case "rcvMaterial": state.ui.receive.materialId = el.value; var m=materialById(el.value); if(m && !state.ui.receive.rate) state.ui.receive.rate=m.purchaseRate; render(); return;
      case "rcvRate": state.ui.receive.rate = el.value; return;
      case "rcvQty": state.ui.receive.qty = el.value; return;
      case "rcvRemark": state.ui.receive.remark = el.value; return;
      case "rcvDate": state.ui.receive.date = el.value; return;
      case "issMaterial": state.ui.issue.materialId = el.value; render(); return;
      case "issQty": state.ui.issue.qty = el.value; return;
      case "issSite": state.ui.issue.siteId = el.value; return;
      case "issRemark": state.ui.issue.remark = el.value; return;
      case "issDate": state.ui.issue.date = el.value; return;
      case "invMaterial": state.ui.inventory.entry.materialId = el.value; render(); return;
      case "invPo": state.ui.inventory.entry.poId = el.value; return;
      case "invQty": state.ui.inventory.entry.qty = el.value; return;
      case "invRate": state.ui.inventory.entry.rate = el.value; return;
      case "invRemark": state.ui.inventory.entry.remark = el.value; return;
      case "reportsTab": return;
      case "ledgerMaterialSelect": state.ui.reports.ledgerMaterialId = el.value; render(); return;
    }
    if(el.classList && el.classList.contains("po-item-material")){
      var idx = parseInt(el.getAttribute("data-idx"),10);
      state.ui.pos.builder.items[idx].materialId = el.value;
      var mm = materialById(el.value);
      if(mm && !state.ui.pos.builder.items[idx].rate) state.ui.pos.builder.items[idx].rate = mm.purchaseRate;
      render();
    }
    if(el.classList && el.classList.contains("po-item-gst")){ updatePoLine(el); return; }
  };
}
function readVal(form,name){ var el = form.querySelector('[name="'+name+'"]'); return el? el.value : ""; }
function scrollTopOfContent(){ var c=document.getElementById("content"); if(c) c.scrollTop=0; }

function updatePoLine(el){
  var idx = parseInt(el.getAttribute("data-idx"),10);
  var item = state.ui.pos.builder.items[idx]; if(!item) return;
  if(el.classList.contains("po-item-qty")) item.qty = el.value;
  else if(el.classList.contains("po-item-rate")) item.rate = el.value;
  else if(el.classList.contains("po-item-gst")) item.gstPct = el.value;
  var taxable = num(item.qty,0)*num(item.rate,0);
  var lineTotal = taxable + taxable*num(item.gstPct,0)/100;
  var cell = document.getElementById("poLineTotal_"+idx); if(cell) cell.textContent = fmtCurrency(lineTotal);
  var totals = poBuilderTotals(state.ui.pos.builder.items);
  var sEl = document.getElementById("poSubtotal"); if(sEl) sEl.textContent = fmtCurrency(totals.subtotal);
  var gtEl = document.getElementById("poGstTotal"); if(gtEl) gtEl.textContent = fmtCurrency(totals.gst);
  var gEl = document.getElementById("poGrandTotal"); if(gEl) gEl.textContent = fmtCurrency(totals.grand);
}
function submitPO(){
  var b = state.ui.pos.builder;
  if(!b.vendorId){ toast("Select a vendor.","danger"); return; }
  var isEditingPo = !!b.id;
  var items = b.items.filter(function(it){return it.materialId && num(it.qty,0)>0;}).map(function(it){
    var m = materialById(it.materialId);
    return {materialId:it.materialId, materialName:m?m.name:"", qty:num(it.qty,0), rate:num(it.rate,0), gstPct:num(it.gstPct,18), receivedQty:num(it.receivedQty,0), remark:(it.remark||"").trim()};
  });
  if(!items.length){ toast("Add at least one line item with a quantity.","danger"); return; }
  var terms = (b.terms||"").trim();
  if(!terms){ toast("Remarks / Terms & Conditions is required before creating the order.","danger"); return; }
  var poDate = b.date||todayISO();
  var po = { vendorId:b.vendorId, date: poDate, siteId:b.siteId||"", items: items, terms: terms };
  if(isEditingPo){ po.id = b.id; po.poNumber = b.poNumber; }
  else { po.poNumber = nextPoNumber(); po.status = "Placed"; }
  savePO(po).then(function(saved){ state.ui.pos.builder=null; state.ui.modal={type:"po-view", id:saved.id}; render(); });
}

/* ---- scoped refreshers (avoid full-page rerender while typing in a search box elsewhere on the page) ---- */
function refreshMaterialList(){ var c=document.getElementById("materialListContainer"); if(c) withFocusPreserved(function(){ c.innerHTML = renderMaterialList(); }); }
function refreshVendorList(){ var c=document.getElementById("vendorListContainer"); if(c) withFocusPreserved(function(){ c.innerHTML = renderVendorList(); }); }
function refreshPoList(){ var c=document.getElementById("poListContainer"); if(c) withFocusPreserved(function(){ c.innerHTML = renderPoList(); }); }
function refreshInvList(){ var c=document.getElementById("invListContainer"); if(c) withFocusPreserved(function(){ c.innerHTML = renderInventoryList(); }); }
function refreshBillsList(){ var c=document.getElementById("billsListContainer"); if(c) withFocusPreserved(function(){ c.innerHTML = state.ui.bills.tab==="payments" ? renderPaymentsList() : renderBillsList(); }); }
function refreshIssueList(){ var c=document.getElementById("issueListContainer"); if(c) withFocusPreserved(function(){ c.innerHTML = renderIssueList(); }); }
function refreshContainer(page){ render(); }

/* ============================= CSV export ============================= */
function toCsv(headers, rows){
  function cell(v){ v = (v===undefined||v===null)?"":String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }
  var lines = [headers.map(cell).join(",")].concat(rows.map(function(r){return r.map(cell).join(",");}));
  return lines.join("\r\n");
}
function exportReportCsv(reportKey){
  var data = reportRows(reportKey);
  if(!data.rows.length){ toast("Nothing to export yet.","danger"); return; }
  var csv = toCsv(data.headers, data.rows);
  var filename = (data.filename||reportKey)+".csv";
  try{
    triggerBrowserDownload(filename, csv, "text/csv;charset=utf-8;");
    toast("Downloaded "+filename+".");
  }catch(err){
    console.error("CSV download failed", err);
    toast("Could not save the file.","danger");
  }
}

/* ============================= boot ============================= */
function tickClock(){ var c = document.querySelector(".clock"); if(c){ var now=new Date(); c.textContent = now.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) + " · " + now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); } }
setInterval(tickClock, 30000);

var __reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!__reduceMotion){
  document.addEventListener("mousemove", function(e){
    var w = document.querySelector(".auth-wrap");
    if(!w) return;
    var r = w.getBoundingClientRect();
    w.style.setProperty("--amx", ((e.clientX - r.left) / r.width * 100) + "%");
    w.style.setProperty("--amy", ((e.clientY - r.top) / r.height * 100) + "%");
  }, {passive:true});
}

window.App = { closeNav: function(){ state.ui.navOpen=false; render(); }, logout: function(){ doLogout(); } };

render();
initApp();

})();
</script>
